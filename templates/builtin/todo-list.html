<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e232c;
    --line: #2a3140;
    --text: #e8edf5;
    --muted: #8b95a8;
    --accent: #6ea8ff;
    --accent-2: #4f8ef7;
    --danger: #ff6b7a;
    --ok: #3dd68c;
    --shadow: 0 10px 40px rgba(0,0,0,.35);
    --radius: 14px;
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
    --edge-hi: inset 0 1px 0 rgba(255, 255, 255, .14);
    --edge-lo: 0 1px 0 rgba(0, 0, 0, .42);
    --depth: var(--edge-hi), var(--edge-lo);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: radial-gradient(1200px 600px at 10% -10%, #1a2740 0%, var(--bg) 55%);
    color: var(--text);
    font: 15px/1.45 ui-sans-serif, system-ui, Segoe UI, sans-serif;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 36px 20px 64px;
  }
  header { margin-bottom: 22px; }
  h1 {
    margin: 0;
    font-size: 28px;
    letter-spacing: -0.03em;
  }
  .meta {
    color: var(--muted);
    font-size: 13px;
    margin-top: 4px;
  }
  .composer {
    display: flex;
    gap: 8px;
    background: var(--panel);
    border: 1px solid transparent;
    border-radius: var(--radius);
    padding: 10px;
    box-shadow: var(--depth), var(--shadow);
  }
  .composer input {
    flex: 1;
    background: transparent;
    border: 0;
    outline: none;
    color: var(--text);
    font: inherit;
    padding: 10px 12px;
  }
  .composer input.scribe-stale {
    outline: 1px dashed rgba(224, 179, 74, 0.7);
    outline-offset: 2px;
  }
  button {
    font: inherit;
    cursor: pointer;
    border: 0;
    border-radius: 10px;
  }
  button:disabled {
    opacity: 0.35;
    cursor: default;
  }
  .add {
    background: var(--accent);
    color: #0b1220;
    font-weight: 650;
    padding: 10px 16px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .38), 0 1px 0 rgba(11, 18, 32, .28);
  }
  .add:hover { background: var(--accent-2); }
  .columns {
    display: grid;
    grid-template-columns: repeat(var(--cols, 1), minmax(240px, 1fr));
    gap: 14px;
    margin-top: 18px;
    align-items: start;
    overflow-x: auto;
    padding: 2px 2px 6px;
  }
  .column {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .columns.multi .column {
    background: rgba(255, 255, 255, .025);
    border-radius: var(--radius);
    padding: 10px;
    box-shadow: var(--depth);
    min-height: 120px;
  }
  .col-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 2px 10px;
    min-height: 34px;
  }
  .col-title,
  .col-title-input {
    font: 650 13px/1.3 ui-sans-serif, system-ui, Segoe UI, sans-serif;
    letter-spacing: .04em;
    text-transform: uppercase;
    border-radius: 8px;
    padding: 5px 7px;
  }
  .col-title {
    color: var(--muted);
    cursor: text;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .col-title:hover {
    background: rgba(255, 255, 255, .06);
    color: var(--text);
  }
  .col-title-input {
    flex: 1;
    min-width: 0;
    color: var(--text);
    background: rgba(8, 12, 20, .28);
    border: 1px solid transparent;
    outline: none;
    box-shadow: var(--depth), 0 0 0 1px var(--accent);
  }
  .col-count {
    flex: 0 0 auto;
    font-size: 12px;
    color: var(--muted);
    background: rgba(255, 255, 255, .06);
    border-radius: 999px;
    padding: 1px 8px;
  }
  .list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }
  .columns.multi .list { min-height: 56px; }
  .columns.multi .list:empty::before {
    content: attr(data-empty);
    display: block;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 16px 8px;
    border: 1px dashed var(--line);
    border-radius: 12px;
  }
  .item {
    display: grid;
    grid-template-columns: 28px 1fr auto;
    align-items: start;
    gap: 8px;
    background: var(--panel);
    border: 1px solid transparent;
    border-radius: 12px;
    padding: 10px;
    cursor: pointer;
    box-shadow: var(--depth);
    touch-action: none;
    user-select: none;
  }
  body.no-checks .item { grid-template-columns: 1fr auto; }
  body.no-checks .item .label { padding-left: 8px; }
  body.no-checks .check,
  body.no-checks .modal-done { display: none; }
  .item:hover {
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2), 0 1px 0 rgba(0, 0, 0, .5);
  }
  .list.reordering .item {
    transition: transform 160ms var(--ease);
  }
  .item.dragging {
    z-index: 30;
    background: var(--panel);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.09), 0 8px 22px rgba(0, 0, 0, 0.45);
    transform: scale(1.03);
    transition: none;
    cursor: grabbing;
  }
  .item-drop-slot {
    flex: 0 0 auto;
    border-radius: 12px;
    border: 1px dashed var(--accent);
    background: transparent;
    pointer-events: none;
  }
  body.dragging-item {
    user-select: none;
    cursor: grabbing;
  }
  .item.done .label-text {
    color: var(--muted);
    text-decoration: line-through;
  }
  .check {
    appearance: none;
    width: 18px;
    height: 18px;
    margin: 7px auto 0;
    border: 1px solid transparent;
    border-radius: 6px;
    background: rgba(255, 255, 255, .04);
    cursor: pointer;
    box-shadow: var(--depth);
  }
  .check:checked {
    background: var(--ok);
    border-color: var(--ok);
  }
  .label {
    min-width: 0;
    padding: 6px 4px;
  }
  .label-text {
    word-break: break-word;
  }
  .snip {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.4;
    margin-top: 3px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .row-thumbs {
    display: flex;
    gap: 4px;
    margin-top: 8px;
  }
  .row-thumbs img {
    width: 28px;
    height: 28px;
    object-fit: cover;
    border-radius: 6px;
    box-shadow: var(--depth);
  }
  .actions { display: flex; gap: 4px; padding-top: 2px; }
  .icon {
    width: 32px;
    height: 32px;
    background: var(--panel-2);
    color: var(--muted);
    box-shadow: var(--depth);
  }
  .icon:hover { color: var(--text); }
  .icon.danger:hover {
    background: #4a1c24;
    color: var(--danger);
  }
  .empty {
    margin-top: 28px;
    text-align: center;
    color: var(--muted);
    padding: 28px;
    box-shadow: var(--depth);
    border: 1px solid transparent;
    border-radius: var(--radius);
  }
  .hidden { display: none !important; }
  .need-reload {
    margin-top: 28px;
    padding: 20px;
    background: var(--panel);
    box-shadow: var(--depth);
    border: 1px solid transparent;
    border-radius: var(--radius);
    color: var(--muted);
  }
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(8, 12, 20, .12);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px 32px;
    z-index: 40;
    overflow: auto;
  }
  .modal {
    width: min(640px, 100%);
    background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
    background-color: rgba(10, 14, 22, .82);
    backdrop-filter: blur(22px) saturate(1.4);
    -webkit-backdrop-filter: blur(22px) saturate(1.4);
    border: 0;
    border-radius: 18px;
    box-shadow: var(--depth), 0 18px 50px rgba(0, 0, 0, .22);
    padding: 22px 22px 16px;
    position: relative;
    transform: translateZ(0);
  }
  .modal:focus { outline: none; }
  .modal.drop-target {
    outline: 2px dashed var(--accent);
    outline-offset: -6px;
  }
  .modal-close {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 32px;
    height: 32px;
    background: rgba(255, 255, 255, .08);
    color: var(--muted);
    border: 1px solid transparent;
    box-shadow: var(--depth);
  }
  .modal-close:hover { color: var(--text); }
  .modal-head {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding-right: 36px;
    margin-bottom: 16px;
  }
  .modal-done {
    flex: 0 0 auto;
    margin-top: 6px;
  }
  .modal-done .check { margin: 0; }
  .modal-title {
    margin: 0;
    font-size: 22px;
    letter-spacing: -0.03em;
    line-height: 1.3;
    cursor: text;
    flex: 1;
    min-width: 0;
    word-break: break-word;
    border-radius: 8px;
    padding: 4px 6px;
  }
  .modal-title:hover { background: rgba(255, 255, 255, .06); }
  #modalTitle:focus-visible { box-shadow: 0 0 0 1px var(--accent); }
  .modal-title-input {
    flex: 1;
    min-width: 0;
    font: 650 22px/1.3 ui-sans-serif, system-ui, Segoe UI, sans-serif;
    letter-spacing: -0.03em;
    color: var(--text);
    background: rgba(8, 12, 20, .28);
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 4px 6px;
    outline: none;
    box-shadow: var(--depth), 0 0 0 1px var(--accent);
  }
  .field-label {
    font-size: 12px;
    font-weight: 650;
    color: var(--muted);
    letter-spacing: .04em;
    text-transform: uppercase;
    margin: 0 0 8px;
  }
  .md-preview {
    min-height: 120px;
    padding: 12px 14px;
    background: rgba(255, 255, 255, .05);
    border: 1px solid transparent;
    border-radius: 12px;
    cursor: text;
    box-shadow: var(--depth);
  }
  .md-preview:hover {
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2), 0 1px 0 rgba(0, 0, 0, .5);
  }
  #mdPreview:focus-visible { box-shadow: var(--depth), 0 0 0 1px var(--accent); }
  .md-preview.placeholder {
    color: var(--muted);
  }
  .md-preview h1, .md-preview h2, .md-preview h3, .md-preview h4 {
    margin: 0.7em 0 0.35em;
    letter-spacing: -0.02em;
    line-height: 1.25;
  }
  .md-preview h1:first-child, .md-preview h2:first-child, .md-preview h3:first-child {
    margin-top: 0;
  }
  .md-preview p { margin: 0.45em 0; }
  .md-preview p:first-child { margin-top: 0; }
  .md-preview p:last-child { margin-bottom: 0; }
  .md-preview ul, .md-preview ol { margin: 0.4em 0; padding-left: 1.3em; }
  .md-preview blockquote {
    margin: 0.5em 0;
    padding: 0.2em 0 0.2em 12px;
    border-left: 3px solid var(--accent);
    color: var(--muted);
  }
  .md-preview hr {
    border: 0;
    border-top: 1px solid var(--line);
    margin: 12px 0;
  }
  .md-preview a { color: var(--accent); }
  .page-link { color: var(--accent); text-decoration: none; border-bottom: 1px dotted currentColor; cursor: pointer; }
  .page-link:hover { border-bottom-style: solid; }
  .md-preview code {
    font: 12.5px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: #0f1115;
    padding: 0.12em 0.38em;
    border-radius: 5px;
    box-shadow: var(--depth);
  }
  .md-preview pre {
    background: #0f1115;
    padding: 12px;
    border-radius: 8px;
    overflow: auto;
    margin: 0.5em 0;
    box-shadow: var(--depth);
  }
  .md-preview pre code { padding: 0; background: transparent; }
  .md-preview img {
    max-width: 100%;
    border-radius: 8px;
    display: block;
    margin: 8px 0;
  }
  .md-editor {
    width: 100%;
    min-height: 168px;
    padding: 12px 14px;
    background: rgba(8, 12, 20, .32);
    border: 1px solid transparent;
    border-radius: 12px;
    color: var(--text);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    resize: vertical;
    outline: none;
    box-shadow: var(--depth), 0 0 0 1px var(--accent);
  }
  .gallery {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .thumb {
    position: relative;
    width: 88px;
    height: 88px;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid transparent;
    background: rgba(8, 12, 20, .35);
    box-shadow: var(--depth);
  }
  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    cursor: zoom-in;
    display: block;
  }
  .thumb .rm {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 22px;
    height: 22px;
    border-radius: 7px;
    background: rgba(15, 17, 21, .8);
    color: var(--text);
    font-size: 14px;
    line-height: 1;
  }
  .thumb .rm:hover {
    background: #4a1c24;
    color: var(--danger);
  }
  .add-img {
    width: 88px;
    height: 88px;
    border: 1px solid transparent;
    background: rgba(255, 255, 255, .04);
    color: var(--muted);
    font-size: 28px;
    line-height: 1;
    box-shadow: var(--depth);
  }
  .add-img:hover {
    color: var(--text);
    box-shadow: inset 0 1px 0 rgba(110, 168, 255, .35), 0 1px 0 rgba(0, 0, 0, .45);
  }
  .hint {
    color: var(--muted);
    font-size: 12px;
    margin: 12px 0 0;
  }
  .hint.error { color: var(--danger); }
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, .82);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 60;
    padding: 24px;
    cursor: zoom-out;
  }
  .lightbox img {
    max-width: min(1100px, 100%);
    max-height: 100%;
    border-radius: 10px;
    box-shadow: var(--shadow);
  }
</style>
</head>
<body>
  <div class="wrap" id="wrap">
    <header>
      <h1>{{title}}</h1>
      <div class="meta" id="meta">0 remaining</div>
    </header>
    <div class="composer">
      <input id="input" type="text" placeholder="Add {{item}}" autocomplete="off">
      <button class="add" id="add" type="button">Add</button>
    </div>
    <div class="columns" id="columns"></div>
    <div class="empty hidden" id="empty">No {{items}} yet. Add {{item}} above.</div>
  </div>
  <input class="col-title-input hidden" id="colInput" type="text" autocomplete="off" aria-label="Column name">
  <div class="overlay hidden" id="overlay">
    <div class="modal" id="modal" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="close" type="button" aria-label="Close">×</button>
      <div class="modal-head">
        <label class="modal-done">
          <input class="check" id="modalDone" type="checkbox" aria-label="Mark complete">
        </label>
        <h2 class="modal-title" id="modalTitle" tabindex="0"></h2>
        <input class="modal-title-input hidden" id="titleInput" type="text" autocomplete="off" aria-label="Title">
      </div>
      <div class="field-label">Description</div>
      <div class="md-preview placeholder" id="mdPreview" tabindex="0" role="textbox" aria-multiline="true" aria-label="Description">Click or press Enter to add a description. Markdown is supported.</div>
      <textarea class="md-editor hidden" id="mdEditor" aria-label="Description" placeholder="Write markdown…"></textarea>
      <div class="field-label" style="margin-top:16px">Images</div>
      <div class="gallery" id="gallery"></div>
      <p class="hint" id="hint">Click the title or description to edit. Click away to save. Paste, drop, or tap + to attach images.</p>
    </div>
  </div>
  <div class="lightbox hidden" id="lightbox"><img id="lightboxImg" alt=""></div>
  <input id="file" type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
<script>
/**
 * Re-rendering a list without disturbing the rows that did not change.
 *
 * A node that is taken out of the document and put back (or replaced by a new copy) loses `:hover` until the
 * pointer next moves and drops its running transitions. A list rebuilt on every server event therefore blinks:
 * the hover highlight falls to nothing and fades back in, on all rows at once (#407).
 *
 * `scribeSyncChildren(parent, nodes)` makes `nodes` the children of `parent`, but keeps a child already there
 * when the new node would look the same, and moves only what is out of place. A kept child keeps its own
 * listeners: handlers on rows that may be kept must read live data, not what they closed over.
 */
(() => {
  // Set on a node after it is in the page (tooltip.js, hover card), so a fresh copy never has them.
  const IGNORED = new Set(["aria-description", "aria-describedby"]);
  // Their state lives in properties, which attributes don't show.
  const STATEFUL = new Set(["INPUT", "TEXTAREA", "SELECT"]);

  function attrs(el) {
    const out = new Map();
    for (const { name, value } of el.attributes) {
      if (IGNORED.has(name)) continue;
      out.set(name, name === "class" ? value.trim().split(/\s+/).join(" ") : value);
    }
    if (out.get("class") === "") out.delete("class");
    return out;
  }

  function same(a, b) {
    if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName) return false;
    if (a.nodeType !== Node.ELEMENT_NODE) return a.nodeValue === b.nodeValue;
    if (STATEFUL.has(a.nodeName) && !(a.nodeName === "INPUT" && a.type === "checkbox" && b.type === "checkbox" && a.checked === b.checked)) return false;
    if (a.childNodes.length !== b.childNodes.length) return false;
    const mine = attrs(a);
    const theirs = attrs(b);
    if (mine.size !== theirs.size) return false;
    for (const [name, value] of mine) {
      if (theirs.get(name) !== value) return false;
    }
    for (let i = 0; i < a.childNodes.length; i += 1) {
      if (!same(a.childNodes[i], b.childNodes[i])) return false;
    }
    return true;
  }

  window.scribeSyncChildren = function scribeSyncChildren(parent, nodes) {
    const wanted = nodes.flatMap((node) => (node.nodeType === Node.DOCUMENT_FRAGMENT_NODE ? [...node.childNodes] : [node]));
    const pool = [...parent.childNodes];
    const next = wanted.map((node) => {
      let at = pool.indexOf(node);
      if (at < 0) at = pool.findIndex((old) => same(old, node));
      return at < 0 ? node : pool.splice(at, 1)[0];
    });
    for (const old of pool) old.remove();
    let cursor = parent.firstChild;
    for (const node of next) {
      if (node === cursor) cursor = cursor.nextSibling;
      else parent.insertBefore(node, cursor);
    }
  };
})();


(function () {
  if (!window.scribe) {
    document.getElementById("empty").className = "need-reload";
    document.getElementById("empty").textContent =
      "Reload the Scribe tab so this page can use shared state.";
    return;
  }

  var values = (scribe.template && scribe.template.values) || {};
  var ITEM = String(values.item || "a task");
  var ITEMS = String(values.items || "tasks");
  var CHECKS = values.checkboxes !== false;
  var COLS = Math.max(1, Math.min(6, Math.floor(Number(values.columns) || 1)));
  var DEFAULT_TITLES = ["To do", "In progress", "Done"];

  var wrapEl = document.getElementById("wrap");
  var columnsEl = document.getElementById("columns");
  var emptyEl = document.getElementById("empty");
  var metaEl = document.getElementById("meta");
  var input = document.getElementById("input");
  var addBtn = document.getElementById("add");
  var colInput = document.getElementById("colInput");
  var overlay = document.getElementById("overlay");
  var modal = document.getElementById("modal");
  var closeBtn = document.getElementById("close");
  var modalTitle = document.getElementById("modalTitle");
  var titleInput = document.getElementById("titleInput");
  var modalDone = document.getElementById("modalDone");
  var mdPreview = document.getElementById("mdPreview");
  var mdEditor = document.getElementById("mdEditor");
  var galleryEl = document.getElementById("gallery");
  var hintEl = document.getElementById("hint");
  var fileEl = document.getElementById("file");
  var lightbox = document.getElementById("lightbox");
  var lightboxImg = document.getElementById("lightboxImg");
  var columnEls = [];
  var listEls = [];
  var titleEls = [];
  var countEls = [];
  var drag = null;
  var editingDesc = false;
  var editingTitle = false;
  var editingCol = -1;
  var cancelCol = false;
  var hintTimer = 0;
  var STATE_MAX = 240000;
  var HINT_DEFAULT = "Click the title or description to edit. Click away to save. Paste, drop, or tap + to attach images.";

  if (!CHECKS) document.body.classList.add("no-checks");
  if (COLS > 1) {
    columnsEl.classList.add("multi");
    wrapEl.style.maxWidth = COLS * 320 + (COLS - 1) * 14 + 40 + "px";
  }
  columnsEl.style.setProperty("--cols", String(COLS));

  scribe.bind(input, "draft", { local: true });
  scribe.bind(mdEditor, "draftDesc", { local: true });
  scribe.bind(titleInput, "draftTitle", { local: true });
  scribe.bind(colInput, "draftColumn", { local: true });

  function buildColumns() {
    for (var i = 0; i < COLS; i++) {
      var section = document.createElement("section");
      section.className = "column";
      var head = document.createElement("div");
      head.className = "col-head";
      var title = document.createElement("span");
      title.className = "col-title";
      title.onclick = (function (index) {
        return function () { startEditColumn(index); };
      })(i);
      var count = document.createElement("span");
      count.className = "col-count";
      head.appendChild(title);
      head.appendChild(count);
      var list = document.createElement("ul");
      list.className = "list";
      list.setAttribute("data-empty", "No " + ITEMS);
      section.appendChild(head);
      section.appendChild(list);
      columnsEl.appendChild(section);
      columnEls.push(section);
      listEls.push(list);
      titleEls.push(title);
      countEls.push(count);
    }
  }

  function items() {
    var list = Array.isArray(scribe.state.todos) ? scribe.state.todos : [];
    return list.map(function (t) {
      return {
        id: t.id,
        text: t.text || "",
        done: !!t.done,
        description: t.description || "",
        images: Array.isArray(t.images) ? t.images : [],
        col: Number.isInteger(t.col) && t.col >= 0 ? t.col : 0
      };
    });
  }

  function visibleItems() {
    return items().filter(function (t) { return t.col < COLS; });
  }

  function columnTitles() {
    return Array.isArray(scribe.state.columnTitles) ? scribe.state.columnTitles : [];
  }

  function columnTitle(index) {
    var saved = String(columnTitles()[index] || "").trim();
    return saved || DEFAULT_TITLES[index] || "Column " + (index + 1);
  }

  function current() {
    var id = scribe.local.openId;
    var list = items();
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  function newId(prefix) {
    return (prefix || "t") + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  function setTodos(next) {
    scribe.set({ todos: next });
    render();
  }

  function addItem() {
    var text = String(scribe.local.draft != null ? scribe.local.draft : input.value || "").trim();
    if (!text) {
      input.focus();
      return;
    }
    scribe.set({ todos: items().concat([{ id: newId("t"), text: text, done: false, description: "", images: [], col: 0 }]) });
    scribe.setLocal({ draft: "" });
    input.value = "";
    render();
    input.focus();
  }

  function toggle(id, done) {
    setTodos(items().map(function (todo) {
      return todo.id === id ? Object.assign({}, todo, { done: done }) : todo;
    }));
  }

  function remove(id) {
    var next = items().filter(function (todo) { return todo.id !== id; });
    if (scribe.local.openId === id) scribe.setLocal({ openId: "" });
    setTodos(next);
  }

  function snipText(desc) {
    var s = String(desc || "").replace(/\r\n/g, "\n");
    s = s.replace(/```[\s\S]*?```/g, " ");
    s = s.replace(/!\[[^\]]*\]\([^)]+\)/g, " ");
    // Page links survive as tokens (linkText renders them); markdown characters inside them are not stripped.
    var links = [];
    s = holdPageLinks(s, function (html) {
      links.push(html);
      return "\u0001" + (links.length - 1) + "\u0001";
    });
    s = s.replace(/\[([^\]]+)\]\([^)]+\)/g, "$1");
    s = (s.split("\n").filter(function (line) { return line.trim(); })[0] || "");
    s = s.replace(/[`*_#>~]/g, "").replace(/^\s*[-*]\s+/, "").replace(/\s+/g, " ").trim();
    return s.replace(/\u0001(\d+)\u0001/g, function (_, i) {
      var a = document.createElement("div");
      a.innerHTML = links[Number(i)];
      var link = a.firstChild;
      var target = link.getAttribute("data-scribe-open");
      var mode = link.getAttribute("data-scribe-mode");
      var label = link.textContent;
      return "[[" + (mode ? mode + ":" : "") + target + (label ? "|" + label : "") + "]]";
    });
  }

  function render() {
    renderLists();
    syncModal();
  }

  function renderLists() {
    if (drag && drag.moved) return;
    var list = visibleItems();
    var open = 0;
    var nodes = Array.from({ length: COLS }, function () { return []; });
    for (var c = 0; c < COLS; c++) {
      titleEls[c].textContent = columnTitle(c);
    }
    var perColumn = new Array(COLS).fill(0);
    for (var i = 0; i < list.length; i++) {
      var item = list[i];
      nodes[item.col].push(row(item));
      perColumn[item.col]++;
      if (!item.done) open++;
    }
    for (var n = 0; n < COLS; n++) {
      window.scribeSyncChildren(listEls[n], nodes[n]);
      countEls[n].textContent = String(perColumn[n]);
    }
    emptyEl.className = COLS === 1 && !list.length ? "empty" : "empty hidden";
    metaEl.textContent = (CHECKS ? open + " remaining" : list.length + " total") +
      " \u00b7 Click " + ITEM + " to open";
  }

  function row(item) {
    var li = document.createElement("li");
    li.className = CHECKS && item.done ? "item done" : "item";
    li.setAttribute("data-id", item.id);
    // The item under the cursor for template agent actions with context: ["item"] (Scribe's right-click menu).
    li.setAttribute("data-scribe-context", JSON.stringify({ item: item.text || "" }));

    var check = document.createElement("input");
    check.type = "checkbox";
    check.className = "check";
    check.checked = item.done;
    check.setAttribute("aria-label", "Mark complete");
    check.onclick = function (event) {
      event.stopPropagation();
      toggle(item.id, check.checked);
    };

    var label = document.createElement("div");
    label.className = "label";
    var title = document.createElement("div");
    title.className = "label-text";
    title.innerHTML = linkText(item.text);
    label.appendChild(title);
    var snip = snipText(item.description);
    if (snip) {
      var snipEl = document.createElement("div");
      snipEl.className = "snip";
      snipEl.innerHTML = linkText(snip);
      label.appendChild(snipEl);
    }
    if (item.images.length) {
      var strip = document.createElement("div");
      strip.className = "row-thumbs";
      var max = Math.min(3, item.images.length);
      for (var i = 0; i < max; i++) {
        var im = document.createElement("img");
        im.src = item.images[i].data;
        im.alt = item.images[i].name || "";
        strip.appendChild(im);
      }
      label.appendChild(strip);
    }

    var actions = document.createElement("div");
    actions.className = "actions";
    var del = iconBtn("\u00d7", "Delete", false, function () { remove(item.id); });
    del.className += " danger";
    actions.appendChild(del);
    actions.onclick = function (event) { event.stopPropagation(); };

    li.appendChild(check);
    li.appendChild(label);
    li.appendChild(actions);
    li.onclick = function (event) {
      if (event.target.closest && event.target.closest(".check, .actions, button, input, a")) return;
      openModal(item.id);
    };
    li.addEventListener("pointerdown", function (event) {
      onItemPointerDown(event, li);
    });
    return li;
  }

  function iconBtn(text, title, disabled, onClick) {
    var el = document.createElement("button");
    el.type = "button";
    el.dataset.tooltip = title;
    el.setAttribute("aria-label", title);
    el.className = "icon";
    el.textContent = text;
    el.disabled = disabled;
    el.onclick = function (event) {
      event.stopPropagation();
      onClick();
    };
    return el;
  }

  function startEditColumn(index) {
    if (editingCol === index) return;
    if (editingCol >= 0) saveColumn();
    editingCol = index;
    cancelCol = false;
    var text = columnTitle(index);
    scribe.setLocal({ draftColumn: text });
    colInput.value = text;
    titleEls[index].classList.add("hidden");
    titleEls[index].after(colInput);
    colInput.classList.remove("hidden");
    colInput.focus();
    colInput.select();
  }

  function saveColumn() {
    if (editingCol < 0) return;
    var index = editingCol;
    editingCol = -1;
    colInput.classList.add("hidden");
    titleEls[index].classList.remove("hidden");
    if (cancelCol) {
      cancelCol = false;
      return;
    }
    var text = String(scribe.local.draftColumn != null ? scribe.local.draftColumn : colInput.value).trim();
    var titles = columnTitles().slice();
    while (titles.length <= index) titles.push("");
    titles[index] = text;
    scribe.set({ columnTitles: titles });
    titleEls[index].textContent = columnTitle(index);
  }

  function onItemPointerDown(event, el) {
    if (event.button !== 0 || drag) return;
    if (event.target.closest && event.target.closest(".check, .actions, button, input, a")) return;
    drag = {
      id: el.getAttribute("data-id"),
      pointerId: event.pointerId,
      startX: event.clientX,
      startY: event.clientY,
      moved: false,
      col: listEls.indexOf(el.parentNode),
      offsetX: 0,
      offsetY: 0,
      el: el,
      placeholder: null,
      scrollX: 0,
      scrollY: 0
    };
    drag.controller = window.scribeDrag({ event: event, target: el.parentNode,
      onStart: beginItemDrag,
      onMove: function (move) { onItemPointerMove(move); return Boolean(drag && (drag.scrollX || drag.scrollY)); },
      onDrop: onItemPointerUp,
      onCancel: abortDrag,
    });
  }

  function onItemPointerMove(event) {
    if (!drag || event.pointerId !== drag.pointerId) return;
    if (!drag || !drag.moved) return;
    event.preventDefault();
    positionDraggedItem(event.clientX, event.clientY);
    updateDragScroll(event.clientX, event.clientY);
    moveDropSlot();
  }

  function beginItemDrag(event) {
    if (!drag) return;
    var el = drag.el;
    var rect = el.getBoundingClientRect();
    drag.moved = true;
    // From where the press started, so the item doesn't trail the pointer by the drag threshold.
    drag.offsetX = drag.startX - rect.left;
    drag.offsetY = drag.startY - rect.top;
    var placeholder = document.createElement("li");
    placeholder.className = "item-drop-slot";
    placeholder.style.height = rect.height + "px";
    el.replaceWith(placeholder);
    drag.placeholder = placeholder;
    el.classList.add("dragging");
    document.body.appendChild(el);
    el.style.position = "fixed";
    el.style.left = rect.left + "px";
    el.style.top = rect.top + "px";
    el.style.width = rect.width + "px";
    el.style.height = rect.height + "px";
    el.style.zIndex = "30";
    el.style.pointerEvents = "none";
    el.style.margin = "0";

    for (var i = 0; i < listEls.length; i++) listEls[i].classList.add("reordering");
    document.body.classList.add("dragging-item");
  }

  function positionDraggedItem(clientX, clientY) {
    if (!drag || !drag.el) return;
    drag.x = clientX; drag.y = clientY;
    drag.el.style.transform = "translate(" + (clientX - drag.startX) + "px, " + (clientY - drag.startY) + "px)";
  }

  function layoutMid(el) {
    var rect = window.scribeDrag.layout(el);
    return rect.top + rect.height / 2;
  }

  function othersIn(list) {
    var others = [];
    for (var i = 0; i < list.children.length; i++) {
      if (list.children[i] !== drag.placeholder) others.push(list.children[i]);
    }
    return others;
  }

  function columnAt(clientX) {
    var best = 0;
    var bestDist = Infinity;
    for (var i = 0; i < columnEls.length; i++) {
      var rect = window.scribeDrag.rect(columnEls[i]);
      var dist = clientX < rect.left ? rect.left - clientX : clientX > rect.right ? clientX - rect.right : 0;
      if (dist < bestDist) {
        bestDist = dist;
        best = i;
      }
    }
    return best;
  }

  function slotIndex(others, clientY) {
    var index = 0;
    for (var i = 0; i < others.length; i++) {
      if (layoutMid(others[i]) < clientY) index = i + 1;
    }
    return index;
  }

  function beginSlide(node) {
    if (node._slide) node._slide.finish();
    var token = {};
    token.finish = function (e) {
      if (e && (e.target !== node || e.propertyName !== "transform")) return;
      if (node._slide !== token) return;
      clearTimeout(token.timer);
      node.removeEventListener("transitionend", token.finish);
      node.style.transition = "";
      node.style.transform = "";
      if (!node.style.length) node.removeAttribute("style");
      delete node._slide;
    };
    node._slide = token;
    token.timer = setTimeout(token.finish, 500);
    return token;
  }

  function flipLists(nodes, mutate) {
    var first = new Map();
    for (var i = 0; i < nodes.length; i++) {
      first.set(nodes[i], nodes[i].getBoundingClientRect());
    }
    mutate();
    var lastBoxes = new Map(nodes.map(function (node) { return [node, node.getBoundingClientRect()]; }));
    for (var n = 0; n < nodes.length; n++) {
      var node = nodes[n];
      if (node === drag.placeholder) continue;
      var prev = first.get(node);
      if (!prev || !node.isConnected) continue;
      var last = lastBoxes.get(node);
      var dx = prev.left - last.left;
      var dy = prev.top - last.top;
      if (Math.abs(dx) < 1 && Math.abs(dy) < 1) continue;
      var token = beginSlide(node);
      node.style.transition = "none";
      node.style.transform = "translate(" + dx + "px, " + dy + "px)";
      requestAnimationFrame(function (target, slide) {
        return function () {
          requestAnimationFrame(function () {
            if (target._slide !== slide) return;
            clearTimeout(slide.timer);
            slide.timer = setTimeout(slide.finish, 240);
            target.addEventListener("transitionend", slide.finish);
            target.style.transition = "";
            target.style.transform = "";
          });
        };
      }(node, token));
    }
  }

  /** Choose a destination from cached item centers before moving the slot. */
  function moveDropSlot() {
    if (!drag || !drag.placeholder || !drag.el) return;
    var ghost = { left: drag.x - drag.offsetX, top: drag.y - drag.offsetY, width: parseFloat(drag.el.style.width), height: parseFloat(drag.el.style.height) };
    var col = columnAt(ghost.left + ghost.width / 2);
    var list = listEls[col];
    var mid = ghost.top + ghost.height / 2;
    var placeholder = drag.placeholder;
    var others = othersIn(list);
    var target = slotIndex(others, mid);
    var before = others[target] || null;
    if (placeholder.parentNode === list && placeholder.nextElementSibling === before) return;
    var affected = others.concat(othersIn(placeholder.parentNode)).filter(function (node) {
      var box = window.scribeDrag.layout(node);
      return box.bottom >= 0 && box.top <= window.innerHeight;
    });
    flipLists(Array.from(new Set(affected)), function () { list.insertBefore(placeholder, before); drag.col = col; });
    window.scribeDrag.invalidate();
  }

  function updateDragScroll(clientX, clientY) {
    if (!drag) return;
    var edge = 48;
    var dirY = 0;
    var dirX = 0;
    if (clientY < edge) dirY = -1;
    else if (clientY > window.innerHeight - edge) dirY = 1;
    if (columnsEl.scrollWidth > columnsEl.clientWidth) {
      var rect = window.scribeDrag.rect(columnsEl);
      if (clientX < rect.left + edge) dirX = -1;
      else if (clientX > rect.right - edge) dirX = 1;
    }
    var beforeY = window.scrollY, beforeX = columnsEl.scrollLeft;
    if (dirY) window.scrollBy(0, dirY * 14);
    if (dirX) columnsEl.scrollLeft += dirX * 14;
    drag.scrollX = columnsEl.scrollLeft !== beforeX ? dirX : 0;
    drag.scrollY = window.scrollY !== beforeY ? dirY : 0;
  }

  function stopDragVisual() {
    if (drag) drag.controller.dispose();
    for (var i = 0; i < listEls.length; i++) listEls[i].classList.remove("reordering");
    document.body.classList.remove("dragging-item");
    if (!drag) return;
    var el = drag.el;
    el.classList.remove("dragging");
    el.style.position = "";
    el.style.left = "";
    el.style.top = "";
    el.style.width = "";
    el.style.height = "";
    el.style.zIndex = "";
    el.style.pointerEvents = "";
    el.style.margin = "";
    el.style.transform = "";
    el.style.transition = "";
    if (drag.placeholder && drag.placeholder.isConnected) {
      drag.placeholder.replaceWith(el);
    } else if (!el.isConnected) {
      listEls[0].appendChild(el);
    }
  }

  function abortDrag() {
    if (!drag) return;
    var moved = drag.moved;
    stopDragVisual();
    drag = null;
    if (moved) render();
  }

  function dropResult(id, col, nextId, prevId) {
    var list = items();
    var moving = null;
    var rest = [];
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === id) moving = list[i];
      else rest.push(list[i]);
    }
    if (!moving) return null;
    moving = Object.assign({}, moving, { col: col });
    var at = -1;
    var j;
    if (nextId) {
      for (j = 0; j < rest.length; j++) if (rest[j].id === nextId) at = j;
    }
    if (at < 0 && prevId) {
      for (j = 0; j < rest.length; j++) if (rest[j].id === prevId) at = j + 1;
    }
    if (at < 0) {
      for (j = 0; j < rest.length; j++) if (rest[j].col === col) at = j + 1;
    }
    if (at < 0) at = rest.length;
    rest.splice(at, 0, moving);
    return rest;
  }

  function onItemPointerUp(event) {
    if (!drag || event.pointerId !== drag.pointerId) return;
    if (!drag.moved) {
      drag = null;
      return;
    }
    var placeholder = drag.placeholder;
    var next = placeholder && placeholder.nextElementSibling;
    var prev = placeholder && placeholder.previousElementSibling;
    var id = drag.id;
    var col = drag.col;
    stopDragVisual();
    drag = null;
    var before = items();
    var result = dropResult(id, col, next && next.getAttribute("data-id"), prev && prev.getAttribute("data-id"));
    var key = function (list) {
      return list.map(function (t) { return t.id + ":" + t.col; }).join("\0");
    };
    if (result && key(result) !== key(before)) setTodos(result);
    else render();
  }

  function openModal(id) {
    editingDesc = false;
    editingTitle = false;
    mdEditor.classList.add("hidden");
    mdPreview.classList.remove("hidden");
    titleInput.classList.add("hidden");
    modalTitle.classList.remove("hidden");
    scribe.setLocal({ openId: id, draftDesc: "", draftTitle: "" });
    syncModal();
    // Enter the dialog without highlighting an editable control before Tab is pressed.
    modal.focus({ preventScroll: true });
  }

  function closeModal() {
    if (editingDesc) saveDesc();
    if (editingTitle) saveTitle();
    scribe.setLocal({ openId: "" });
    overlay.classList.add("hidden");
    lightbox.classList.add("hidden");
  }

  function syncModal() {
    var item = current();
    if (!item) {
      overlay.classList.add("hidden");
      editingDesc = false;
      editingTitle = false;
      return;
    }
    overlay.classList.remove("hidden");
    modalDone.checked = item.done;
    if (!editingTitle) modalTitle.innerHTML = linkText(item.text || "Untitled");
    if (!editingDesc) showPreview(item);
    renderGallery(item);
  }

  function showPreview(item) {
    var desc = item.description || "";
    if (!desc.trim()) {
      mdPreview.className = "md-preview placeholder";
      mdPreview.textContent = "Click or press Enter to add a description. Markdown is supported.";
      return;
    }
    mdPreview.className = "md-preview";
    mdPreview.innerHTML = renderMarkdown(desc, item.images);
  }

  function startEditTitle() {
    var item = current();
    if (!item) return;
    if (editingDesc) saveDesc();
    if (!editingTitle) {
      editingTitle = true;
      scribe.setLocal({ draftTitle: item.text });
      titleInput.value = item.text;
      modalTitle.classList.add("hidden");
      titleInput.classList.remove("hidden");
    }
    titleInput.focus();
    titleInput.select();
  }

  function saveTitle() {
    if (!editingTitle) return;
    editingTitle = false;
    var item = current();
    if (!item) return;
    var text = String(scribe.local.draftTitle != null ? scribe.local.draftTitle : titleInput.value).trim();
    if (!text) text = item.text;
    titleInput.classList.add("hidden");
    modalTitle.classList.remove("hidden");
    setTodos(items().map(function (t) {
      return t.id === item.id ? Object.assign({}, t, { text: text }) : t;
    }));
  }

  function startEditDesc() {
    var item = current();
    if (!item) return;
    if (editingTitle) saveTitle();
    if (!editingDesc) {
      editingDesc = true;
      scribe.setLocal({ draftDesc: item.description || "" });
      mdEditor.value = item.description || "";
      mdPreview.classList.add("hidden");
      mdEditor.classList.remove("hidden");
    }
    mdEditor.focus();
  }

  function saveDesc() {
    if (!editingDesc) return;
    editingDesc = false;
    var item = current();
    if (!item) return;
    var text = String(scribe.local.draftDesc != null ? scribe.local.draftDesc : mdEditor.value);
    mdEditor.classList.add("hidden");
    mdPreview.classList.remove("hidden");
    setTodos(items().map(function (t) {
      return t.id === item.id ? Object.assign({}, t, { description: text }) : t;
    }));
  }

  function renderGallery(item) {
    galleryEl.replaceChildren();
    for (var i = 0; i < item.images.length; i++) {
      (function (img) {
        var wrap = document.createElement("div");
        wrap.className = "thumb";
        var el = document.createElement("img");
        el.src = img.data;
        el.alt = img.name || "";
        el.onclick = function () {
          lightboxImg.src = img.data;
          lightboxImg.alt = img.name || "";
          lightbox.classList.remove("hidden");
        };
        var rm = document.createElement("button");
        rm.type = "button";
        rm.className = "rm";
        rm.setAttribute("aria-label", "Remove image");
        rm.textContent = "\u00d7";
        rm.onclick = function (event) {
          event.stopPropagation();
          removeImage(img.id);
        };
        wrap.appendChild(el);
        wrap.appendChild(rm);
        galleryEl.appendChild(wrap);
      })(item.images[i]);
    }
    var add = document.createElement("button");
    add.type = "button";
    add.className = "add-img";
    add.setAttribute("aria-label", "Add images");
    add.textContent = "+";
    add.onclick = function () { fileEl.click(); };
    galleryEl.appendChild(add);
  }

  function removeImage(imageId) {
    var item = current();
    if (!item) return;
    setTodos(items().map(function (t) {
      if (t.id !== item.id) return t;
      return Object.assign({}, t, {
        images: t.images.filter(function (im) { return im.id !== imageId; })
      });
    }));
  }

  function stateFits(nextTodos) {
    var probe = {
      todos: nextTodos,
      columnTitles: columnTitles(),
      draft: scribe.local.draft || "",
      draftDesc: scribe.local.draftDesc || "",
      draftTitle: scribe.local.draftTitle || "",
      draftColumn: scribe.local.draftColumn || "",
      openId: scribe.local.openId || ""
    };
    return JSON.stringify(probe).length < STATE_MAX;
  }

  function setHint(msg, isError) {
    hintEl.textContent = msg || HINT_DEFAULT;
    hintEl.className = isError ? "hint error" : "hint";
    clearTimeout(hintTimer);
    if (msg && msg !== HINT_DEFAULT) {
      hintTimer = setTimeout(function () {
        hintEl.textContent = HINT_DEFAULT;
        hintEl.className = "hint";
      }, 4000);
    }
  }

  function addImageFile(file, intoMarkdown) {
    var target = current();
    if (!file || !target) return;
    if (!/^image\/(png|jpe?g|gif|webp)$/i.test(file.type)) {
      setHint("Use png, jpeg, gif, or webp.", true);
      return;
    }
    setHint("Adding image…");
    shrinkImage(file, function (err, blob) {
      if (err || !blob) {
        setHint("Could not read that image.", true);
        return;
      }
      scribe.saveAsset(blob, { name: file.name || "image" }).then(function (asset) {
        placeImage(target.id, asset.url, asset.name, intoMarkdown);
        if (asset.usage && asset.usage.warning) {
          setHint("Image added. Storage is filling up: " + asset.usage.warning + ".", true);
        }
      }, function (saveErr) {
        setHint("Could not save that image: " + saveErr.message, true);
      });
    });
  }

  /** Images live in page assets; an item keeps { id, name, data: "/blob/<id>" }. Older items may hold data: URLs. */
  function placeImage(itemId, data, name, intoMarkdown) {
    if (!items().some(function (t) { return t.id === itemId; })) return;
    var img = { id: newId("i"), name: name, data: data };
    var next = items().map(function (t) {
      if (t.id !== itemId) return t;
      return Object.assign({}, t, { images: t.images.concat([img]) });
    });
    if (!stateFits(next)) {
      setHint("This list is too large to add more.", true);
      return;
    }
    var open = current();
    if (intoMarkdown && editingDesc && open && open.id === itemId) {
      insertAtCursor(mdEditor, "![" + (name || "image") + "](#img-" + img.id + ")\n");
      next = next.map(function (t) {
        return t.id === itemId ? Object.assign({}, t, { description: mdEditor.value }) : t;
      });
      scribe.set({ todos: next });
      scribe.setLocal({ draftDesc: mdEditor.value });
      renderGallery(current());
      renderLists();
      setHint("Image added.");
      return;
    }
    setTodos(next);
    setHint("Image added.");
  }

  function insertAtCursor(textarea, text) {
    var start = textarea.selectionStart || 0;
    var end = textarea.selectionEnd || 0;
    var v = textarea.value;
    textarea.value = v.slice(0, start) + text + v.slice(end);
    textarea.selectionStart = textarea.selectionEnd = start + text.length;
    scribe.setLocal({ draftDesc: textarea.value });
  }

  /** Small files are kept as they are (animated gifs stay animated); large ones are scaled down to a JPEG. */
  function shrinkImage(file, cb) {
    if (file.size <= 1536 * 1024) {
      cb(null, file);
      return;
    }
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      URL.revokeObjectURL(url);
      var max = 1920;
      var w = img.naturalWidth || img.width;
      var h = img.naturalHeight || img.height;
      var scale = Math.min(1, max / Math.max(w, h, 1));
      var canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(w * scale));
      canvas.height = Math.max(1, Math.round(h * scale));
      var ctx = canvas.getContext("2d");
      ctx.fillStyle = "#1a1d24";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      canvas.toBlob(function (blob) {
        cb(blob ? null : new Error("encode"), blob);
      }, "image/jpeg", 0.85);
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      cb(new Error("decode"));
    };
    img.src = url;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function resolveImg(url, images) {
    url = String(url || "").trim();
    var hash = url.match(/^#img-(.+)$/);
    if (hash) {
      for (var i = 0; i < images.length; i++) {
        if (images[i].id === hash[1]) return images[i].data;
      }
      return "";
    }
    if (/^https?:\/\//i.test(url)) return url;
    if (/^data:image\/(png|jpeg|jpg|gif|webp);/i.test(url)) return url;
    if (/^\/blob\/pa_[0-9a-f]{24}$/.test(url)) return url;
    return "";
  }

  // ---------- page links ----------
  // [[scribe:key]] (or a bare page id) shows the page's title, [[target|label]] your own text, [[peek:target]] /
  // [[split:target]] pick a mode, and [label](scribe:key) / (peek:…) / (split:…) is the markdown form. A key or id
  // written on its own (scribe:some-key, t_1a2b3c4d) links too. Scribe resolves titles and strikes out missing pages.
  var LINK_MODES = { tab: "tab", peek: "peek", split: "split" };
  var PAGE_LINK_RES = [
    /\[\[\s*(?:(tab|peek|split):)?([^\]|]+?)\s*(?:\|([^\]]*))?\]\]/g,
    /\[([^\]]+)\]\((?:(tab|peek|split):([^)\s]+)|(scribe:[^)\s]+))\)/g,
    /(^|[^\w\/#:-])((?:scribe:[a-z0-9._-]*[a-z0-9_-]|t_[0-9a-f]{8})(?:#[\w=&%.:-]*\w)?)(?![\w-])/g
  ];
  function pageLinkHtml(target, label, mode) {
    return '<a href="#" class="page-link" data-scribe-open="' + escapeHtml(target) + '"' +
      (mode ? ' data-scribe-mode="' + mode + '"' : "") + ">" + escapeHtml(label) + "</a>";
  }
  /** Replace page links in raw text with held anchors; `hold` returns a placeholder the caller swaps back. */
  function holdPageLinks(s, hold) {
    s = s.replace(PAGE_LINK_RES[0], function (_, mode, target, label) {
      return hold(pageLinkHtml(target, String(label || "").trim(), mode ? LINK_MODES[mode] : ""));
    });
    s = s.replace(PAGE_LINK_RES[1], function (_, label, mode, target, key) {
      return hold(pageLinkHtml(target || key, label, mode ? LINK_MODES[mode] : ""));
    });
    return s.replace(PAGE_LINK_RES[2], function (_, pre, target) {
      return pre + hold(pageLinkHtml(target, "", ""));
    });
  }
  /** Plain text (a title, a comment) as HTML with only its page links live. */
  function linkText(raw) {
    var held = [];
    var s = holdPageLinks(String(raw == null ? "" : raw), function (html) {
      held.push(html);
      return "\u0000" + (held.length - 1) + "\u0000";
    });
    return escapeHtml(s).replace(/\u0000(\d+)\u0000/g, function (_, i) { return held[Number(i)]; });
  }
  /** Page links reduced to their label or target, for places that only take text. */
  function plainLinks(raw) {
    return String(raw == null ? "" : raw)
      .replace(PAGE_LINK_RES[0], function (_, mode, target, label) { return String(label || "").trim() || target; })
      .replace(PAGE_LINK_RES[1], "$1")
      .replace(PAGE_LINK_RES[2], "$1$2");
  }

  function mdInline(raw, images) {
    var held = [];
    function hold(html) {
      held.push(html);
      return "\u0000" + (held.length - 1) + "\u0000";
    }
    var str = String(raw || "");
    str = str.replace(/`([^`]+)`/g, function (_, c) {
      return hold("<code>" + escapeHtml(c) + "</code>");
    });
    str = holdPageLinks(str, hold);
    str = str.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, function (_, alt, url) {
      var src = resolveImg(url, images);
      if (!src) return _;
      return hold('<img src="' + escapeHtml(src) + '" alt="' + escapeHtml(alt) + '">');
    });
    str = str.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, function (_, t, url) {
      return hold('<a href="' + escapeHtml(url) + '" target="_blank" rel="noopener">' + escapeHtml(t) + "</a>");
    });
    str = escapeHtml(str);
    str = str.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    str = str.replace(/__([^_]+)__/g, "<strong>$1</strong>");
    str = str.replace(/\*([^*]+)\*/g, "<em>$1</em>");
    str = str.replace(/_([^_]+)_/g, "<em>$1</em>");
    str = str.replace(/~~([^~]+)~~/g, "<del>$1</del>");
    str = str.replace(/\u0000(\d+)\u0000/g, function (_, i) { return held[+i]; });
    return str;
  }

  function renderMarkdown(src, images) {
    src = String(src || "").replace(/\r\n/g, "\n");
    var lines = src.split("\n");
    var html = [];
    var i = 0;
    function isFence(line) { return /^```/.test(line); }
    function isHeading(line) { return /^#{1,6} /.test(line); }
    function isQuote(line) { return /^> /.test(line); }
    function isUl(line) { return /^[-*] /.test(line); }
    function isOl(line) { return /^\d+\. /.test(line); }
    function isHr(line) { return /^(---+|\*\*\*+)$/.test(line); }
    while (i < lines.length) {
      var line = lines[i];
      if (isFence(line)) {
        var code = [];
        i++;
        while (i < lines.length && !isFence(lines[i])) {
          code.push(lines[i]);
          i++;
        }
        if (i < lines.length) i++;
        html.push("<pre><code>" + escapeHtml(code.join("\n")) + "</code></pre>");
        continue;
      }
      if (isHeading(line)) {
        var n = line.match(/^#+/)[0].length;
        html.push("<h" + n + ">" + mdInline(line.replace(/^#+\s+/, ""), images) + "</h" + n + ">");
        i++;
        continue;
      }
      if (isQuote(line)) {
        var q = [];
        while (i < lines.length && isQuote(lines[i])) {
          q.push(lines[i].replace(/^>\s?/, ""));
          i++;
        }
        html.push("<blockquote>" + q.map(function (l) { return mdInline(l, images); }).join("<br>") + "</blockquote>");
        continue;
      }
      if (isUl(line)) {
        html.push("<ul>");
        while (i < lines.length && isUl(lines[i])) {
          html.push("<li>" + mdInline(lines[i].slice(2), images) + "</li>");
          i++;
        }
        html.push("</ul>");
        continue;
      }
      if (isOl(line)) {
        html.push("<ol>");
        while (i < lines.length && isOl(lines[i])) {
          html.push("<li>" + mdInline(lines[i].replace(/^\d+\.\s+/, ""), images) + "</li>");
          i++;
        }
        html.push("</ol>");
        continue;
      }
      if (isHr(line)) {
        html.push("<hr>");
        i++;
        continue;
      }
      if (!line.trim()) {
        i++;
        continue;
      }
      var p = [];
      while (i < lines.length && lines[i].trim() && !isFence(lines[i]) && !isHeading(lines[i]) && !isQuote(lines[i]) && !isUl(lines[i]) && !isOl(lines[i]) && !isHr(lines[i])) {
        p.push(lines[i]);
        i++;
      }
      html.push("<p>" + p.map(function (l) { return mdInline(l, images); }).join("<br>") + "</p>");
    }
    return html.join("");
  }

  addBtn.onclick = addItem;
  input.onkeydown = function (event) {
    if (event.key === "Enter") {
      event.preventDefault();
      addItem();
    }
  };

  colInput.onblur = saveColumn;
  colInput.onkeydown = function (event) {
    if (event.key !== "Enter" && event.key !== "Escape") return;
    event.preventDefault();
    cancelCol = event.key === "Escape";
    saveColumn();
    colInput.blur();
  };

  modalTitle.onclick = function (event) {
    if (event.target.closest && event.target.closest("a")) return;
    startEditTitle();
  };
  modalTitle.onkeydown = function (event) {
    if (event.target !== modalTitle || event.altKey || event.ctrlKey || event.metaKey) return;
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      startEditTitle();
    }
  };
  mdPreview.onclick = function (event) {
    if (event.target.closest && event.target.closest("a")) return;
    startEditDesc();
  };
  mdPreview.onkeydown = function (event) {
    if (event.target !== mdPreview || event.altKey || event.ctrlKey || event.metaKey) return;
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      startEditDesc();
    } else if (event.key.length === 1) {
      event.preventDefault();
      startEditDesc();
      insertAtCursor(mdEditor, event.key);
    }
  };
  titleInput.onblur = saveTitle;
  titleInput.onkeydown = function (event) {
    if (event.key === "Enter") {
      event.preventDefault();
      titleInput.blur();
    }
    if (event.key === "Escape") {
      event.preventDefault();
      event.stopPropagation();
      titleInput.blur();
    }
    if (event.key === "Tab" && !event.shiftKey) {
      event.preventDefault();
      saveTitle();
      startEditDesc();
    }
  };
  mdEditor.onblur = saveDesc;
  mdEditor.onkeydown = function (event) {
    if (event.key === "Escape" || ((event.ctrlKey || event.metaKey) && event.key === "Enter")) {
      event.preventDefault();
      event.stopPropagation();
      mdEditor.blur();
    }
    if (event.key === "Tab" && event.shiftKey) {
      event.preventDefault();
      saveDesc();
      startEditTitle();
    }
  };

  modalDone.onchange = function () {
    var item = current();
    if (!item) return;
    toggle(item.id, modalDone.checked);
  };

  closeBtn.onclick = closeModal;
  overlay.onclick = function (event) {
    if (event.target === overlay) closeModal();
  };
  lightbox.onclick = function () {
    lightbox.classList.add("hidden");
    lightboxImg.src = "";
  };

  fileEl.onchange = function () {
    var files = fileEl.files;
    if (!files) return;
    for (var i = 0; i < files.length; i++) addImageFile(files[i], false);
    fileEl.value = "";
  };

  modal.ondragover = function (event) {
    if (!event.dataTransfer || !event.dataTransfer.types) return;
    var types = event.dataTransfer.types;
    var hasFile = false;
    for (var i = 0; i < types.length; i++) if (types[i] === "Files") hasFile = true;
    if (!hasFile) return;
    event.preventDefault();
    modal.classList.add("drop-target");
  };
  modal.ondragleave = function (event) {
    if (!modal.contains(event.relatedTarget)) modal.classList.remove("drop-target");
  };
  modal.ondrop = function (event) {
    modal.classList.remove("drop-target");
    var files = event.dataTransfer && event.dataTransfer.files;
    if (!files || !files.length) return;
    event.preventDefault();
    event.stopPropagation();
    for (var i = 0; i < files.length; i++) addImageFile(files[i], editingDesc);
  };

  document.addEventListener("paste", function (event) {
    if (!current()) return;
    var clip = event.clipboardData && event.clipboardData.items;
    if (!clip) return;
    var found = false;
    for (var i = 0; i < clip.length; i++) {
      if (clip[i].type.indexOf("image/") === 0) {
        found = true;
        addImageFile(clip[i].getAsFile(), editingDesc);
      }
    }
    if (found) event.preventDefault();
  });

  function dialogFocusables(root) {
    var nodes = root.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]):not([type="hidden"]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])');
    var out = [];
    for (var i = 0; i < nodes.length; i++) {
      var node = nodes[i];
      if (node.offsetWidth || node.offsetHeight || node.getClientRects().length) out.push(node);
    }
    return out;
  }
  function trapDialogTab(event, root) {
    if (event.key !== "Tab" || event.defaultPrevented) return;
    var list = dialogFocusables(root);
    if (!list.length) {
      event.preventDefault();
      return;
    }
    var first = list[0], last = list[list.length - 1];
    var active = document.activeElement;
    if (event.shiftKey) {
      if (active === root || active === first || !root.contains(active)) {
        event.preventDefault();
        last.focus();
      }
    } else if (active === last || !root.contains(active)) {
      event.preventDefault();
      first.focus();
    }
  }
  document.addEventListener("keydown", function (event) {
    if (!overlay.classList.contains("hidden")) trapDialogTab(event, modal);
  });
  document.addEventListener("keydown", function (event) {
    if (event.key !== "Escape") return;
    if (drag) {
      abortDrag();
      return;
    }
    if (!lightbox.classList.contains("hidden")) {
      lightbox.classList.add("hidden");
      lightboxImg.src = "";
      return;
    }
    if (editingDesc || editingTitle || editingCol >= 0) return;
    if (current()) closeModal();
  });

  // Drafts and the open item used to live in shared state; they are this viewer's own now.
  var legacy = {};
  ["draft", "draftDesc", "draftTitle", "draftColumn", "openId"].forEach(function (key) {
    if (key in scribe.state) legacy[key] = undefined;
  });
  if (Object.keys(legacy).length) scribe.set(legacy);

  scribe.onChange(function () {
    if (drag && drag.moved) return;
    renderLists();
    if (!editingDesc && !editingTitle) syncModal();
  });
  buildColumns();
  render();
  input.focus();
  // A link to one item (scribe:page-key#item=<id>, or a search hit): open it.
  if (scribe.onOpen) scribe.onOpen(function (request) {
    var id = request.args.item || request.args.record;
    var found = id && items().some(function (item) { return item.id === id; });
    if (!found || scribe.local.openId === id) return;
    var rows = document.querySelectorAll(".item");
    for (var i = 0; i < rows.length; i++) {
      if (rows[i].getAttribute("data-id") === id) rows[i].scrollIntoView({ block: "center" });
    }
    openModal(id);
  });
  // Protected values (#1046): blurred until clicked; right-click offers Unprotect and Edit hint.
  if (scribe.protect) scribe.protect.watch(document.body);
})();
</script>
</body>
</html>
