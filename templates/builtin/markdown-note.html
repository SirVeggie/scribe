<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown note</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --line: #2a3140;
    --text: #e8edf5;
    --muted: #8b95a8;
    --accent: #6ea8ff;
    --shadow: 0 10px 40px rgba(0,0,0,.35);
    --radius: 14px;
    --edge-hi: inset 0 1px 0 rgba(255, 255, 255, .14);
    --edge-lo: 0 1px 0 rgba(0, 0, 0, .42);
    --depth: var(--edge-hi), var(--edge-lo);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: radial-gradient(1200px 600px at 10% -10%, #1a2740 0%, var(--bg) 55%);
    color: var(--text);
    font: 15px/1.45 ui-sans-serif, system-ui, Segoe UI, sans-serif;
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 36px 20px 64px;
  }
  header { margin-bottom: 22px; }
  h1.page-title {
    margin: 0;
    font-size: 28px;
    letter-spacing: -0.03em;
    padding: 2px 8px;
    margin-left: -8px;
    border-radius: 8px;
    cursor: text;
    outline: none;
    word-break: break-word;
  }
  h1.page-title:hover { background: rgba(255, 255, 255, .05); }
  h1.page-title:focus { background: rgba(8, 12, 20, .32); box-shadow: var(--depth), 0 0 0 1px var(--accent); }
  .hidden { display: none !important; }
  .md-preview, .md-editor {
    min-height: 240px;
    padding: 16px 18px;
    border: 1px solid transparent;
    border-radius: var(--radius);
  }
  .md-preview {
    background: var(--panel);
    cursor: text;
    box-shadow: var(--depth), var(--shadow);
    word-break: break-word;
  }
  .md-preview:hover {
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2), 0 1px 0 rgba(0, 0, 0, .5), var(--shadow);
  }
  #preview:focus-visible { box-shadow: var(--depth), var(--shadow), 0 0 0 1px var(--accent); }
  .md-preview.placeholder { color: var(--muted); }
  .md-preview h1, .md-preview h2, .md-preview h3, .md-preview h4, .md-preview h5, .md-preview h6 {
    margin: 0.8em 0 0.35em;
    letter-spacing: -0.02em;
    line-height: 1.25;
  }
  .md-preview > :first-child { margin-top: 0; }
  .md-preview > :last-child { margin-bottom: 0; }
  .md-preview p { margin: 0.55em 0; }
  .md-preview ul, .md-preview ol { margin: 0.45em 0; padding-left: 1.4em; }
  .md-preview blockquote {
    margin: 0.6em 0;
    padding: 0.2em 0 0.2em 12px;
    border-left: 3px solid var(--accent);
    color: var(--muted);
  }
  .md-preview hr {
    border: 0;
    border-top: 1px solid var(--line);
    margin: 14px 0;
  }
  .md-preview a { color: var(--accent); }
  .page-link { text-decoration: none; border-bottom: 1px dotted currentColor; cursor: pointer; }
  .page-link:hover { border-bottom-style: solid; }
  .md-preview code {
    font: 12.5px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: #0f1115;
    padding: 0.12em 0.38em;
    border-radius: 5px;
    box-shadow: var(--depth);
  }
  .md-preview pre {
    background: #0f1115;
    padding: 12px;
    border-radius: 8px;
    overflow: auto;
    margin: 0.6em 0;
    box-shadow: var(--depth);
  }
  .md-preview pre code { padding: 0; background: transparent; box-shadow: none; }
  .md-preview img {
    max-width: 100%;
    border-radius: 8px;
    display: block;
    margin: 8px 0;
  }
  .md-preview li > ul, .md-preview li > ol { margin: 0.1em 0; }
  .md-preview li.task { list-style: none; }
  .md-preview .task-box { margin: 0 0.45em 0 -1.35em; vertical-align: -2px; accent-color: var(--accent); cursor: pointer; }
  .md-preview .code-block { position: relative; }
  .md-preview .code-copy {
    position: absolute;
    top: 6px;
    right: 6px;
    padding: 2px 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel);
    color: var(--muted);
    font: inherit;
    font-size: 11.5px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.12s;
  }
  .md-preview .code-block:hover .code-copy, .md-preview .code-copy:focus-visible { opacity: 1; }
  .md-preview .code-copy:hover { color: var(--text); }
  .md-editor {
    display: block;
    width: 100%;
    min-height: 360px;
    background: rgba(8, 12, 20, .32);
    color: var(--text);
    font: inherit;
    resize: vertical;
    outline: none;
    box-shadow: var(--depth), 0 0 0 1px var(--accent);
  }
  .need-reload {
    padding: 20px;
    background: var(--panel);
    box-shadow: var(--depth);
    border-radius: var(--radius);
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1 class="page-title" id="title" tabindex="0" role="textbox" aria-label="Title"></h1>
    </header>
    <div class="md-preview placeholder" id="preview" tabindex="0" role="textbox" aria-multiline="true" aria-label="Note">Click or press Enter to write. Markdown is supported.</div>
    <textarea class="md-editor hidden" id="editor" aria-label="Note" placeholder="Write markdown…" spellcheck="false"></textarea>
  </div>
<script>
(function () {
  var preview = document.getElementById("preview");
  var editor = document.getElementById("editor");
  var titleEl = document.getElementById("title");

  if (!window.scribe) {
    preview.className = "need-reload";
    preview.textContent = "Reload the Scribe tab so this page can use shared state.";
    return;
  }

  var editing = false;

  scribe.bind(editor, "draftText", { local: true });

  function text() {
    return typeof scribe.state.text === "string" ? scribe.state.text : "";
  }

  function showPreview() {
    var src = text();
    if (!src.trim()) {
      preview.className = "md-preview placeholder";
      preview.textContent = "Click or press Enter to write. Markdown is supported; [[page-key]] links another board page.";
      return;
    }
    preview.className = "md-preview";
    preview.innerHTML = renderMarkdown(src);
  }

  function startEdit() {
    if (editing) return;
    editing = true;
    var src = text();
    scribe.setLocal({ draftText: src });
    editor.value = src;
    preview.classList.add("hidden");
    editor.classList.remove("hidden");
    editor.style.height = Math.max(360, preview.offsetHeight || 0) + "px";
    editor.focus();
  }

  function stopEdit() {
    if (!editing) return;
    editing = false;
    var src = String(scribe.local.draftText != null ? scribe.local.draftText : editor.value);
    scribe.set({ text: src });
    editor.classList.add("hidden");
    preview.classList.remove("hidden");
    showPreview();
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function safeUrl(url, forImage) {
    url = String(url || "").trim();
    if (/^https?:\/\//i.test(url)) return url;
    if (forImage && /^data:image\/(png|jpeg|jpg|gif|webp);/i.test(url)) return url;
    return "";
  }

  // ---------- page links ----------
  // [[scribe:key]] (or a bare page id) shows the page's title, [[target|label]] your own text, [[peek:target]] /
  // [[split:target]] pick a mode, and [label](scribe:key) / (peek:…) / (split:…) is the markdown form. A key or id
  // written on its own (scribe:some-key, t_1a2b3c4d) links too. Scribe resolves titles and strikes out missing pages.
  var LINK_MODES = { tab: "tab", peek: "peek", split: "split" };
  var PAGE_LINK_RES = [
    /\[\[\s*(?:(tab|peek|split):)?([^\]|]+?)\s*(?:\|([^\]]*))?\]\]/g,
    /\[([^\]]+)\]\((?:(tab|peek|split):([^)\s]+)|(scribe:[^)\s]+))\)/g,
    /(^|[^\w\/#:-])((?:scribe:[a-z0-9._-]*[a-z0-9_-]|t_[0-9a-f]{8})(?:#[\w=&%.:-]*\w)?)(?![\w-])/g
  ];
  function pageLinkHtml(target, label, mode) {
    return '<a href="#" class="page-link" data-scribe-open="' + escapeHtml(target) + '"' +
      (mode ? ' data-scribe-mode="' + mode + '"' : "") + ">" + escapeHtml(label) + "</a>";
  }
  /** Replace page links in raw text with held anchors; `hold` returns a placeholder the caller swaps back. */
  function holdPageLinks(s, hold) {
    s = s.replace(PAGE_LINK_RES[0], function (_, mode, target, label) {
      return hold(pageLinkHtml(target, String(label || "").trim(), mode ? LINK_MODES[mode] : ""));
    });
    s = s.replace(PAGE_LINK_RES[1], function (_, label, mode, target, key) {
      return hold(pageLinkHtml(target || key, label, mode ? LINK_MODES[mode] : ""));
    });
    return s.replace(PAGE_LINK_RES[2], function (_, pre, target) {
      return pre + hold(pageLinkHtml(target, "", ""));
    });
  }

  function mdInline(raw) {
    var held = [];
    function hold(html) {
      held.push(html);
      return "\u0000" + (held.length - 1) + "\u0000";
    }
    var str = String(raw || "");
    str = str.replace(/`([^`]+)`/g, function (_, c) {
      return hold("<code>" + escapeHtml(c) + "</code>");
    });
    str = holdPageLinks(str, hold);
    str = str.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, function (_, alt, url) {
      var src = safeUrl(url, true);
      if (!src) return _;
      return hold('<img src="' + escapeHtml(src) + '" alt="' + escapeHtml(alt) + '">');
    });
    str = str.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (_, t, url) {
      var href = safeUrl(url, false);
      if (!href) return _;
      return hold('<a href="' + escapeHtml(href) + '" target="_blank" rel="noopener">' + escapeHtml(t) + "</a>");
    });
    str = escapeHtml(str);
    str = str.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    str = str.replace(/__([^_]+)__/g, "<strong>$1</strong>");
    str = str.replace(/\*([^*]+)\*/g, "<em>$1</em>");
    str = str.replace(/(^|[^\w])_([^_]+)_(?!\w)/g, "$1<em>$2</em>");
    str = str.replace(/~~([^~]+)~~/g, "<del>$1</del>");
    str = str.replace(/\u0000(\d+)\u0000/g, function (_, i) { return held[+i]; });
    return str;
  }

  // Lists nest by indentation, spaces or tabs. "- [ ] " and "- [x] " items are checkboxes: ticking one ticks its
  // sub-items too, and a parent is ticked once all of its sub-items are.
  var LIST_ITEM = /^([ \t]*)([-*+]|\d+\.)\s+(.*)$/;
  var TASK_ITEM = /^([ \t]*(?:[-*+]|\d+\.)\s+)\[([ xX])\](?=\s|$)/;
  function indentOf(line) {
    var w = 0;
    for (var k = 0; k < line.length && (line[k] === " " || line[k] === "\t"); k++) w += line[k] === "\t" ? 4 : 1;
    return w;
  }
  function renderList(lines, i, inlineHtml, tasks) {
    var root = { indent: -1, children: [] }, path = [root];
    for (; i < lines.length; i++) {
      var m = LIST_ITEM.exec(lines[i]);
      if (!m) break;
      var node = { indent: indentOf(m[1]), ordered: /\d/.test(m[2]), num: parseInt(m[2], 10), text: m[3], line: i, children: [] };
      while (path.length > 1 && node.indent <= path[path.length - 1].indent) path.pop();
      path[path.length - 1].children.push(node);
      path.push(node);
    }
    function items(list) {
      var out = "";
      for (var k = 0; k < list.length;) {
        var ordered = list[k].ordered;
        out += ordered ? (list[k].num !== 1 ? '<ol start="' + list[k].num + '">' : "<ol>") : "<ul>";
        for (; k < list.length && list[k].ordered === ordered; k++) out += item(list[k]);
        out += ordered ? "</ol>" : "</ul>";
      }
      return out;
    }
    function item(node) {
      var task = /^\[([ xX])\](?:\s+|$)(.*)$/.exec(node.text);
      if (!task) return "<li>" + inlineHtml(node.text) + items(node.children) + "</li>";
      return '<li class="task"><input type="checkbox" class="task-box" data-line="' + node.line + '"' +
        (task[1] !== " " ? " checked" : "") + (tasks ? "" : " disabled") + ">" + inlineHtml(task[2]) + items(node.children) + "</li>";
    }
    return { html: items(root.children), next: i };
  }
  /** The text with the checkbox on `line` flipped, its sub-items with it and its parents updated; null if no checkbox is there. */
  function toggleTask(src, line) {
    var lines = String(src == null ? "" : src).replace(/\r\n?/g, "\n").split("\n");
    var m = TASK_ITEM.exec(lines[line] || "");
    if (!m) return null;
    function set(k, on) { lines[k] = lines[k].replace(TASK_ITEM, function (_, lead) { return lead + (on ? "[x]" : "[ ]"); }); }
    function subTasks(k) {
      var out = [], base = indentOf(lines[k]);
      for (var j = k + 1; j < lines.length && LIST_ITEM.test(lines[j]) && indentOf(lines[j]) > base; j++) if (TASK_ITEM.test(lines[j])) out.push(j);
      return out;
    }
    var on = m[2] === " ";
    set(line, on);
    subTasks(line).forEach(function (k) { set(k, on); });
    for (var k = line, indent = indentOf(lines[line]); k > 0 && LIST_ITEM.test(lines[k - 1]);) {
      k--;
      if (indentOf(lines[k]) >= indent) continue;
      indent = indentOf(lines[k]);
      var subs = subTasks(k);
      if (TASK_ITEM.test(lines[k]) && subs.length) set(k, subs.every(function (j) { return TASK_ITEM.exec(lines[j])[2] !== " "; }));
    }
    return lines.join("\n");
  }
  function codeBlockHtml(codeHtml) {
    return '<div class="code-block"><button type="button" class="code-copy">Copy</button><pre><code>' + codeHtml + "</code></pre></div>";
  }
  function copyCode(button) {
    var code = button.parentNode.querySelector("code");
    if (!code || !navigator.clipboard || !navigator.clipboard.writeText) return;
    navigator.clipboard.writeText(code.textContent).then(function () {
      button.textContent = "Copied";
      setTimeout(function () { button.textContent = "Copy"; }, 1200);
    }, function () { button.textContent = "Not copied"; });
  }
  /** A click that ends a drag-selection of text in root: it should leave the text selected, not start editing. */
  function selectingText(root) {
    var sel = window.getSelection && window.getSelection();
    return !!(sel && !sel.isCollapsed && root.contains(sel.anchorNode));
  }
  function renderMarkdown(src) {
    var lines = String(src || "").replace(/\r\n/g, "\n").split("\n");
    var html = [];
    var i = 0;
    function isFence(line) { return /^```/.test(line); }
    function isHeading(line) { return /^#{1,6} /.test(line); }
    function isQuote(line) { return /^>\s?/.test(line); }
    function isHr(line) { return /^(---+|\*\*\*+|___+)\s*$/.test(line); }
    function isBlock(line) {
      return isFence(line) || isHeading(line) || isQuote(line) || LIST_ITEM.test(line) || isHr(line);
    }
    while (i < lines.length) {
      var line = lines[i];
      if (isFence(line)) {
        var code = [];
        i++;
        while (i < lines.length && !isFence(lines[i])) code.push(lines[i++]);
        if (i < lines.length) i++;
        html.push(codeBlockHtml(escapeHtml(code.join("\n"))));
        continue;
      }
      if (isHeading(line)) {
        var n = line.match(/^#+/)[0].length;
        html.push("<h" + n + ">" + mdInline(line.replace(/^#+\s+/, "")) + "</h" + n + ">");
        i++;
        continue;
      }
      if (isQuote(line)) {
        var q = [];
        while (i < lines.length && isQuote(lines[i])) q.push(lines[i++].replace(/^>\s?/, ""));
        html.push("<blockquote>" + q.map(mdInline).join("<br>") + "</blockquote>");
        continue;
      }
      if (isHr(line)) {
        html.push("<hr>");
        i++;
        continue;
      }
      if (LIST_ITEM.test(line)) {
        var list = renderList(lines, i, mdInline, true);
        html.push(list.html);
        i = list.next;
        continue;
      }
      if (!line.trim()) {
        i++;
        continue;
      }
      var p = [];
      while (i < lines.length && lines[i].trim() && !isBlock(lines[i])) p.push(lines[i++]);
      html.push("<p>" + p.map(mdInline).join("<br>") + "</p>");
    }
    return html.join("");
  }

  function insertAtCursor(textarea, text) {
    var start = textarea.selectionStart || 0;
    var end = textarea.selectionEnd || 0;
    var v = textarea.value;
    textarea.value = v.slice(0, start) + text + v.slice(end);
    textarea.selectionStart = textarea.selectionEnd = start + text.length;
    scribe.setLocal({ draftText: textarea.value });
  }

  preview.onclick = function (event) {
    if (event.target.closest && event.target.closest("a")) return;
    if (event.target.classList.contains("code-copy")) return copyCode(event.target);
    if (event.target.classList.contains("task-box")) {
      var next = toggleTask(text(), Number(event.target.getAttribute("data-line")));
      if (next != null) scribe.set({ text: next });
      showPreview();
      return;
    }
    if (selectingText(preview)) return;
    startEdit();
  };
  preview.onkeydown = function (event) {
    if (event.target !== preview || event.altKey || event.ctrlKey || event.metaKey) return;
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      startEdit();
    } else if (event.key.length === 1) {
      event.preventDefault();
      startEdit();
      insertAtCursor(editor, event.key);
    }
  };
  editor.onblur = stopEdit;
  editor.onkeydown = function (event) {
    if (event.key === "Escape" || ((event.ctrlKey || event.metaKey) && event.key === "Enter")) {
      event.preventDefault();
      editor.blur();
    }
    if (event.key === "Tab" && !event.shiftKey) {
      event.preventDefault();
      var s = editor.selectionStart, e = editor.selectionEnd;
      editor.value = editor.value.slice(0, s) + "  " + editor.value.slice(e);
      editor.selectionStart = editor.selectionEnd = s + 2;
      scribe.setLocal({ draftText: editor.value });
    }
  };

  // ---------- title ----------
  // The heading is the page's title: click it to rename the page (and its tab).
  var titleEditing = false;

  function showTitle() {
    if (!titleEditing) titleEl.textContent = scribe.title || "Untitled";
  }

  function startTitleEdit() {
    if (titleEditing) return;
    titleEditing = true;
    titleEl.contentEditable = "plaintext-only";
    if (titleEl.contentEditable !== "plaintext-only") titleEl.contentEditable = "true";
    titleEl.focus();
    var range = document.createRange();
    range.selectNodeContents(titleEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function stopTitleEdit(save) {
    if (!titleEditing) return;
    titleEditing = false;
    var next = titleEl.textContent.replace(/\s+/g, " ").trim();
    titleEl.contentEditable = "false";
    showTitle();
    if (!save || !next || next === scribe.title) return;
    titleEl.textContent = next;
    scribe.setTitle(next).then(showTitle, showTitle);
  }

  titleEl.onclick = startTitleEdit;
  titleEl.onblur = function () { stopTitleEdit(true); };
  titleEl.onkeydown = function (event) {
    if (!titleEditing) {
      if (event.target === titleEl && (event.key === "Enter" || event.key === "F2")) {
        event.preventDefault();
        startTitleEdit();
      }
      return;
    }
    if (event.key === "Enter") {
      event.preventDefault();
      titleEl.blur();
    } else if (event.key === "Escape") {
      event.preventDefault();
      event.stopPropagation();
      stopTitleEdit(false);
      titleEl.blur();
    }
  };
  titleEl.onpaste = function (event) {
    if (!titleEditing) return;
    event.preventDefault();
    var text = (event.clipboardData ? event.clipboardData.getData("text/plain") : "").replace(/\s+/g, " ");
    document.execCommand("insertText", false, text);
  };
  scribe.onTitle(showTitle);
  showTitle();

  if ("draftText" in scribe.state) scribe.set({ draftText: undefined });

  scribe.onChange(function () {
    if (!editing) showPreview();
  });
  showPreview();
})();
</script>
</body>
</html>
