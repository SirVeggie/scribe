<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown note</title>
<script src="/vendor/marked.js"></script>
<script src="/vendor/purify.js"></script>
<script src="/vendor/scribe-md.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --line: #2a3140;
    --text: #e8edf5;
    --muted: #8b95a8;
    --accent: #6ea8ff;
    --shadow: 0 10px 40px rgba(0,0,0,.35);
    --radius: 14px;
    --edge-hi: inset 0 1px 0 rgba(255, 255, 255, .14);
    --edge-lo: 0 1px 0 rgba(0, 0, 0, .42);
    --depth: var(--edge-hi), var(--edge-lo);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: radial-gradient(1200px 600px at 10% -10%, #1a2740 0%, var(--bg) 55%);
    color: var(--text);
    font: 15px/1.45 ui-sans-serif, system-ui, Segoe UI, sans-serif;
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 36px 20px 64px;
  }
  header { margin-bottom: 22px; }
  h1.page-title {
    margin: 0;
    font-size: 28px;
    letter-spacing: -0.03em;
    padding: 2px 8px;
    margin-left: -8px;
    border-radius: 8px;
    cursor: text;
    outline: none;
    word-break: break-word;
  }
  h1.page-title:hover { background: rgba(255, 255, 255, .05); }
  h1.page-title:focus { background: rgba(8, 12, 20, .32); box-shadow: var(--depth), 0 0 0 1px var(--accent); }
  .hidden { display: none !important; }
  .md-preview, .md-editor {
    min-height: 240px;
    padding: 16px 18px;
    border: 1px solid transparent;
    border-radius: var(--radius);
  }
  .md-preview {
    background: var(--panel);
    cursor: text;
    box-shadow: var(--depth), var(--shadow);
    word-break: break-word;
  }
  .md-preview:hover {
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2), 0 1px 0 rgba(0, 0, 0, .5), var(--shadow);
  }
  #preview:focus-visible { box-shadow: var(--depth), var(--shadow), 0 0 0 1px var(--accent); }
  .md-preview.placeholder { color: var(--muted); }
  .md-preview h1, .md-preview h2, .md-preview h3, .md-preview h4, .md-preview h5, .md-preview h6 {
    margin: 0.8em 0 0.35em;
    letter-spacing: -0.02em;
    line-height: 1.25;
  }
  .md-preview > :first-child { margin-top: 0; }
  .md-preview > :last-child { margin-bottom: 0; }
  .md-preview p { margin: 0.55em 0; }
  .md-preview ul, .md-preview ol { margin: 0.45em 0; padding-left: 1.4em; }
  .md-preview blockquote {
    margin: 0.6em 0;
    padding: 0.2em 0 0.2em 12px;
    border-left: 3px solid var(--accent);
    color: var(--muted);
  }
  .md-preview hr {
    border: 0;
    border-top: 1px solid var(--line);
    margin: 14px 0;
  }
  .md-preview a { color: var(--accent); }
  .page-link { text-decoration: none; border-bottom: 1px dotted currentColor; cursor: pointer; }
  .page-link:hover { border-bottom-style: solid; }
  .md-preview code {
    font: 12.5px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: #0f1115;
    padding: 0.12em 0.38em;
    border-radius: 5px;
    box-shadow: var(--depth);
  }
  .md-preview pre {
    background: #0f1115;
    padding: 12px;
    border-radius: 8px;
    overflow: auto;
    margin: 0.6em 0;
    box-shadow: var(--depth);
  }
  .md-preview pre code { padding: 0; background: transparent; box-shadow: none; }
  .md-preview img {
    max-width: 100%;
    border-radius: 8px;
    display: block;
    margin: 8px 0;
  }
  .md-preview li > ul, .md-preview li > ol { margin: 0.1em 0; }
  .md-preview blockquote > p, .md-preview li > p { margin: 0.2em 0; }
  .md-preview .table-wrap { overflow-x: auto; margin: 0.6em 0; }
  .md-preview table { border-collapse: collapse; }
  .md-preview th, .md-preview td { border: 1px solid var(--line); padding: 5px 10px; text-align: left; }
  .md-preview th { background: rgba(255, 255, 255, .04); }
  .md-preview th[align="center"], .md-preview td[align="center"] { text-align: center; }
  .md-preview th[align="right"], .md-preview td[align="right"] { text-align: right; }
  .md-preview li.task { list-style: none; }
  .md-preview .task-box { margin: 0 0.45em 0 -1.35em; vertical-align: -2px; accent-color: var(--accent); cursor: pointer; }
  .md-preview .code-block { position: relative; }
  .md-preview .code-copy {
    position: absolute;
    top: 6px;
    right: 6px;
    padding: 2px 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel);
    color: var(--muted);
    font: inherit;
    font-size: 11.5px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.12s;
  }
  .md-preview .code-block:hover .code-copy, .md-preview .code-copy:focus-visible { opacity: 1; }
  .md-preview .code-copy:hover { color: var(--text); }
  .md-editor {
    display: block;
    width: 100%;
    min-height: 360px;
    background: rgba(8, 12, 20, .32);
    color: var(--text);
    font: inherit;
    resize: vertical;
    outline: none;
    box-shadow: var(--depth), 0 0 0 1px var(--accent);
  }
  .need-reload {
    padding: 20px;
    background: var(--panel);
    box-shadow: var(--depth);
    border-radius: var(--radius);
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1 class="page-title" id="title" tabindex="0" role="textbox" aria-label="Title"></h1>
    </header>
    <div class="md-preview placeholder" id="preview" tabindex="0" role="textbox" aria-multiline="true" aria-label="Note">Click or press Enter to write. Markdown is supported.</div>
    <textarea class="md-editor hidden" id="editor" aria-label="Note" placeholder="Write markdown…" spellcheck="false"></textarea>
  </div>
<script>
(function () {
  var preview = document.getElementById("preview");
  var editor = document.getElementById("editor");
  var titleEl = document.getElementById("title");

  if (!window.scribe) {
    preview.className = "need-reload";
    preview.textContent = "Reload the Scribe tab so this page can use shared state.";
    return;
  }

  var editing = false;

  scribe.bind(editor, "draftText", { local: true });

  function text() {
    return typeof scribe.state.text === "string" ? scribe.state.text : "";
  }

  function showPreview() {
    var src = text();
    if (!src.trim()) {
      preview.className = "md-preview placeholder";
      preview.textContent = "Click or press Enter to write. Markdown is supported; [[page-key]] links another board page.";
      return;
    }
    preview.className = "md-preview";
    // The shared renderer (/vendor/scribe-md.js); the text as it is if it did not load.
    if (window.ScribeMd) preview.innerHTML = ScribeMd.render(src, { tasks: true });
    else preview.textContent = src;
  }

  function startEdit() {
    if (editing) return;
    editing = true;
    var src = text();
    scribe.setLocal({ draftText: src });
    editor.value = src;
    preview.classList.add("hidden");
    editor.classList.remove("hidden");
    editor.style.height = Math.max(360, preview.offsetHeight || 0) + "px";
    editor.focus();
  }

  function stopEdit() {
    if (!editing) return;
    editing = false;
    var src = String(scribe.local.draftText != null ? scribe.local.draftText : editor.value);
    scribe.set({ text: src });
    editor.classList.add("hidden");
    preview.classList.remove("hidden");
    showPreview();
  }

  function insertAtCursor(textarea, text) {
    var start = textarea.selectionStart || 0;
    var end = textarea.selectionEnd || 0;
    var v = textarea.value;
    textarea.value = v.slice(0, start) + text + v.slice(end);
    textarea.selectionStart = textarea.selectionEnd = start + text.length;
    scribe.setLocal({ draftText: textarea.value });
  }

  preview.onclick = function (event) {
    if (event.target.closest && event.target.closest("a")) return;
    if (!window.ScribeMd) return startEdit();
    if (event.target.classList.contains("code-copy")) return ScribeMd.copyCode(event.target);
    if (event.target.classList.contains("task-box")) {
      var next = ScribeMd.toggleTask(text(), Number(event.target.getAttribute("data-line")));
      if (next != null) scribe.set({ text: next });
      showPreview();
      return;
    }
    if (ScribeMd.selectingText(preview)) return;
    startEdit();
  };
  preview.onkeydown = function (event) {
    if (event.target !== preview || event.altKey || event.ctrlKey || event.metaKey) return;
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      startEdit();
    } else if (event.key.length === 1) {
      event.preventDefault();
      startEdit();
      insertAtCursor(editor, event.key);
    }
  };
  editor.onblur = stopEdit;
  editor.onkeydown = function (event) {
    if (event.key === "Escape" || ((event.ctrlKey || event.metaKey) && event.key === "Enter")) {
      event.preventDefault();
      editor.blur();
    }
    if (event.key === "Tab" && !event.shiftKey) {
      event.preventDefault();
      var s = editor.selectionStart, e = editor.selectionEnd;
      editor.value = editor.value.slice(0, s) + "  " + editor.value.slice(e);
      editor.selectionStart = editor.selectionEnd = s + 2;
      scribe.setLocal({ draftText: editor.value });
    }
  };

  // ---------- title ----------
  // The heading is the page's title: click it to rename the page (and its tab).
  var titleEditing = false;

  function showTitle() {
    if (!titleEditing) titleEl.textContent = scribe.title || "Untitled";
  }

  function startTitleEdit() {
    if (titleEditing) return;
    titleEditing = true;
    titleEl.contentEditable = "plaintext-only";
    if (titleEl.contentEditable !== "plaintext-only") titleEl.contentEditable = "true";
    titleEl.focus();
    var range = document.createRange();
    range.selectNodeContents(titleEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function stopTitleEdit(save) {
    if (!titleEditing) return;
    titleEditing = false;
    var next = titleEl.textContent.replace(/\s+/g, " ").trim();
    titleEl.contentEditable = "false";
    showTitle();
    if (!save || !next || next === scribe.title) return;
    titleEl.textContent = next;
    scribe.setTitle(next).then(showTitle, showTitle);
  }

  titleEl.onclick = startTitleEdit;
  titleEl.onblur = function () { stopTitleEdit(true); };
  titleEl.onkeydown = function (event) {
    if (!titleEditing) {
      if (event.target === titleEl && (event.key === "Enter" || event.key === "F2")) {
        event.preventDefault();
        startTitleEdit();
      }
      return;
    }
    if (event.key === "Enter") {
      event.preventDefault();
      titleEl.blur();
    } else if (event.key === "Escape") {
      event.preventDefault();
      event.stopPropagation();
      stopTitleEdit(false);
      titleEl.blur();
    }
  };
  titleEl.onpaste = function (event) {
    if (!titleEditing) return;
    event.preventDefault();
    var text = (event.clipboardData ? event.clipboardData.getData("text/plain") : "").replace(/\s+/g, " ");
    document.execCommand("insertText", false, text);
  };
  scribe.onTitle(showTitle);
  showTitle();

  if ("draftText" in scribe.state) scribe.set({ draftText: undefined });

  scribe.onChange(function () {
    if (!editing) showPreview();
  });
  showPreview();
})();
</script>
</body>
</html>
