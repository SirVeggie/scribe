<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanban board</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e232c;
    --line: #2a3140;
    --text: #e8edf5;
    --muted: #8b95a8;
    --accent: #6ea8ff;
    --accent-2: #4f8ef7;
    --danger: #ff6b7a;
    --warn: #e0b34a;
    --ok: #3dd68c;
    --agent: #e0b34a;
    --radius: 14px;
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
    --edge-hi: inset 0 1px 0 rgba(255, 255, 255, .14);
    --edge-lo: 0 1px 0 rgba(0, 0, 0, .42);
    --depth: var(--edge-hi), var(--edge-lo);
    --depth-hover: inset 0 1px 0 rgba(255, 255, 255, .2), 0 1px 0 rgba(0, 0, 0, .5);
    --col-w: 284px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(1200px 600px at 10% -10%, #1a2740 0%, var(--bg) 55%);
    color: var(--text);
    font: 14px/1.45 ui-sans-serif, system-ui, Segoe UI, sans-serif;
  }
  body { display: flex; flex-direction: column; overflow: hidden; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 9px; color: inherit; background: none; }
  button:disabled { opacity: .35; cursor: default; }
  input, select, textarea { font: inherit; color: var(--text); }
  .hidden { display: none !important; }

  header { padding: 22px 24px 12px; flex: 0 0 auto; }
  .head-row { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 26px; letter-spacing: -0.03em; line-height: 1.2; }
  #boardTitle { cursor: text; border-radius: 7px; padding: 3px 6px; margin: -3px -6px; outline: none; overflow-wrap: anywhere; min-width: 1ch; }
  #boardTitle:hover { background: rgba(255, 255, 255, .05); }
  #boardTitle:focus { box-shadow: 0 0 0 1px var(--accent); }
  .meta { color: var(--muted); font-size: 13px; padding-bottom: 3px; }
  .toolbar { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
  .field {
    background: var(--panel);
    border: 0;
    border-radius: 10px;
    padding: 7px 10px;
    box-shadow: var(--depth);
    outline: none;
    min-width: 0;
  }
  .field:focus { box-shadow: var(--depth), 0 0 0 1px var(--accent); }
  /* Themed dropdown standing in for each <select> (see enhanceSelect). */
  .select-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    max-width: 220px;
    padding: 7px 32px 7px 10px;
    text-align: left;
    cursor: pointer;
    color: var(--text);
  }
  .side .select-btn { max-width: none; }
  .select-btn:hover { box-shadow: var(--depth-hover); }
  .select-btn.open { box-shadow: var(--depth), 0 0 0 1px var(--accent); }
  .select-btn .select-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .select-btn .select-text.muted { color: var(--muted); }
  .select-btn::after {
    content: "";
    position: absolute;
    right: 13px;
    top: 50%;
    width: 6px;
    height: 6px;
    margin-top: -5px;
    border-right: 1.5px solid var(--muted);
    border-bottom: 1.5px solid var(--muted);
    transform: rotate(45deg);
    transition: transform 150ms var(--ease), margin-top 150ms var(--ease);
  }
  .select-btn.open::after { margin-top: -1px; transform: rotate(225deg); }
  .select-list {
    position: fixed;
    z-index: 100; /* above dialogs (.confirm-back) that hold selects */
    min-width: 160px;
    max-height: 300px;
    overflow-y: auto;
    padding: 4px;
    border-radius: 11px;
    background: rgba(18, 22, 30, .98);
    box-shadow: var(--depth), 0 14px 40px rgba(0, 0, 0, .5);
    animation: select-in 110ms var(--ease);
  }
  @keyframes select-in { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
  .select-list button {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    text-align: left;
    padding: 7px 10px 7px 8px;
    border-radius: 7px;
    white-space: nowrap;
    color: var(--text);
  }
  .select-list button .tick-mark { width: 14px; flex: 0 0 auto; color: var(--accent); font-size: 12px; }
  .select-list button.excluded .tick-mark { color: var(--danger, #f87171); }
  .select-list button.active { background: rgba(255, 255, 255, .08); }
  .select-list button[aria-selected="true"] { font-weight: 600; }
  .select-list button.placeholder { color: var(--muted); }
  .select-list.has-search, .select-list.filter-list {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    max-height: min(360px, calc(100vh - 24px));
  }
  .select-list .menu-search { width: 100%; margin: 0 0 4px; flex: 0 0 auto; }
  .select-list .select-opts { overflow-y: auto; flex: 1 1 auto; min-height: 0; }
  .select-list .empty-row { color: var(--muted); padding: 7px 9px; font-size: 12.5px; }
  .search { width: 220px; }
  .tool {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--panel);
    box-shadow: var(--depth);
    padding: 7px 12px;
    min-height: calc(1.45em + 14px);
    color: var(--muted);
  }
  .tool:hover { color: var(--text); box-shadow: var(--depth-hover); }
  .tool.on { color: var(--text); box-shadow: var(--depth), 0 0 0 1px var(--accent); }
  .tool.icon { padding: 7px 10px; min-width: calc(1.45em + 14px); }
  .tool.icon svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .spacer { flex: 1; }

  .board {
    flex: 1 1 auto;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 6px 24px 24px;
    overflow: auto;
    min-height: 0;
  }
  .column {
    flex: 0 0 var(--col-w);
    width: var(--col-w);
    max-height: 100%;
    display: flex;
    flex-direction: column;
    background: rgba(255, 255, 255, .025);
    border-radius: var(--radius);
    box-shadow: var(--depth);
    min-height: 90px;
  }
  .column.col-dragging { opacity: .35; }
  .col-slot {
    flex: 0 0 var(--col-w);
    align-self: stretch;
    border: 1px dashed var(--accent);
    border-radius: var(--radius);
  }
  .col-head {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 8px 8px 10px;
    cursor: grab;
    user-select: none;
  }
  .col-title, .col-title-input {
    font: 650 12.5px/1.3 ui-sans-serif, system-ui, Segoe UI, sans-serif;
    letter-spacing: .05em;
    text-transform: uppercase;
    border-radius: 7px;
    padding: 4px 6px;
  }
  .col-title {
    color: var(--muted);
    cursor: text;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .col-title:hover { background: rgba(255, 255, 255, .06); color: var(--text); }
  .col-title-input {
    flex: 1;
    min-width: 0;
    background: rgba(8, 12, 20, .35);
    border: 0;
    outline: none;
    box-shadow: 0 0 0 1px var(--accent);
  }
  .role {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    line-height: 1;
    padding: 3px 5px;
    border-radius: 6px;
    background: rgba(255, 255, 255, .06);
    color: var(--muted);
  }
  button.role { border-radius: 6px; }
  button.role.agent:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .role.agent, .role.working { color: var(--agent); background: rgba(224, 179, 74, .12); }
  .role.agent:hover { background: rgba(224, 179, 74, .22); }
  .role.agent.paused {
    color: var(--muted);
    background: rgba(255, 255, 255, .06);
  }
  .role.agent.paused:hover { background: rgba(255, 255, 255, .1); }
  .role .pause-ic {
    width: 9px;
    height: 9px;
    fill: currentColor;
    display: block;
  }
  /* The inbox tag shows its pause icon only on hover (or while paused). */
  .role.agent .pause-ic {
    width: 0;
    margin-left: -4px;
    opacity: 0;
    transition: width 150ms ease, margin-left 150ms ease, opacity 150ms ease;
  }
  .role.agent:hover .pause-ic,
  .role.agent:focus-visible .pause-ic,
  .role.agent.paused .pause-ic {
    width: 9px;
    margin-left: 0;
    opacity: 1;
  }
  @media (prefers-reduced-motion: reduce) {
    .role.agent .pause-ic { transition: none; }
  }
  .role.review { color: var(--accent); background: rgba(110, 168, 255, .12); }
  .role.done { color: var(--ok); background: rgba(61, 214, 140, .12); }
  .col-count {
    margin-left: auto;
    flex: 0 0 auto;
    font-size: 12px;
    color: var(--muted);
    background: rgba(255, 255, 255, .06);
    border-radius: 999px;
    padding: 1px 8px;
  }
  .col-count.at { color: var(--warn); background: rgba(224, 179, 74, .14); }
  .col-count.over { color: var(--danger); background: rgba(255, 107, 122, .14); }
  .col-menu-btn {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    color: var(--muted);
    font-size: 16px;
    line-height: 1;
  }
  .col-menu-btn:hover { color: var(--text); background: rgba(255, 255, 255, .06); }
  .cards {
    list-style: none;
    margin: 0;
    padding: 2px 8px 4px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    overflow-y: auto;
    min-height: 12px;
    flex: 1 1 auto;
  }
  .add-card {
    margin: 2px 8px 8px;
    padding: 7px 8px;
    text-align: left;
    color: var(--muted);
    border-radius: 10px;
  }
  .add-card:hover { background: rgba(255, 255, 255, .05); color: var(--text); }
  .composer { margin: 2px 8px 8px; }
  .composer textarea {
    width: 100%;
    resize: none;
    background: var(--panel);
    border: 0;
    border-radius: 10px;
    padding: 8px 10px;
    box-shadow: var(--depth), 0 0 0 1px var(--accent);
    outline: none;
    min-height: 58px;
  }
  .composer .row { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
  .primary {
    background: var(--accent);
    color: #0b1220;
    font-weight: 650;
    padding: 6px 12px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .38), 0 1px 0 rgba(11, 18, 32, .28);
  }
  .primary:hover { background: var(--accent-2); }
  .ghost { padding: 6px 10px; color: var(--muted); }
  .ghost:hover { color: var(--text); background: rgba(255, 255, 255, .06); }
  .danger-btn { padding: 6px 10px; color: var(--danger); }
  .danger-btn:hover { background: rgba(255, 107, 122, .12); }

  .add-column {
    flex: 0 0 var(--col-w);
    padding: 12px;
    text-align: left;
    color: var(--muted);
    border-radius: var(--radius);
    border: 1px dashed var(--line);
  }
  .add-column:hover { color: var(--text); border-color: var(--muted); }

  .card {
    position: relative;
    background: var(--panel);
    border-radius: 11px;
    padding: 9px 10px 8px;
    box-shadow: var(--depth);
    cursor: pointer;
    user-select: none;
    touch-action: none;
    border-left: 3px solid transparent;
  }
  .card:hover { box-shadow: var(--depth-hover); }
  .card.p1 { border-left-color: #6b7a93; }
  .card.p2 { border-left-color: var(--accent); }
  .card.p3 { border-left-color: var(--warn); }
  .card.p4 { border-left-color: var(--danger); }
  .card.is-done .card-title { color: var(--muted); }
  .card.is-done { opacity: .72; }
  .card.src { visibility: hidden; }
  .card.ghost-card {
    position: fixed;
    z-index: 50;
    pointer-events: none;
    transform: rotate(1.5deg) scale(1.02);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .09), 0 10px 26px rgba(0, 0, 0, .5);
  }
  .column.ghost-col {
    position: fixed;
    z-index: 50;
    pointer-events: none;
    transform: rotate(1deg);
    box-shadow: 0 12px 30px rgba(0, 0, 0, .5);
    background: #1a1e27;
  }
  .card-slot {
    flex: 0 0 auto;
    border: 1px dashed var(--accent);
    border-radius: 11px;
  }
  body.dragging, body.dragging * { cursor: grabbing !important; user-select: none; }
  /* Scroll anchoring would undo each slot move near the top edge (the anchor card shifts), so the
     slot ping-pongs past the same cards every frame while auto-scrolling up. */
  body.dragging .cards, body.dragging #board { overflow-anchor: none; }
  .cover {
    display: block;
    width: calc(100% + 20px);
    margin: -9px -10px 8px;
    max-height: 180px;
    height: auto;
    object-fit: contain;
    object-position: center;
    border-radius: 9px 11px 0 0;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  .chip-bar { height: 6px; width: 28px; border-radius: 3px; }
  .card-title { word-break: break-word; }
  .num { color: var(--muted); font-size: 12px; margin-right: 4px; }
  .card-creator { display: block; margin-top: 6px; color: var(--muted); font-size: 11.5px; overflow-wrap: anywhere; }
  button.card-creator { padding: 0; border: 0; background: none; text-align: left; text-decoration: underline; text-underline-offset: 2px; }
  .badges { display: flex; flex-wrap: wrap; gap: 5px 9px; margin-top: 6px; color: var(--muted); font-size: 11.5px; align-items: center; }
  .badge { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
  .badge.usage { display: block; min-width: 0; max-width: 100%; white-space: normal; overflow-wrap: anywhere; }
  .badge.soon { color: var(--warn); }
  .badge.late { color: var(--danger); }
  .badge.full { color: var(--ok); }
  .badge .ic { width: 13px; height: 13px; flex: 0 0 auto; }
  .badge .ic .box { fill: none; stroke: currentColor; stroke-width: 1.5; }
  .badge .ic .mark { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .badge.full .ic .box { fill: var(--ok); stroke: var(--ok); }
  .badge.full .ic .mark { stroke: #0b1a12; }
  .badge.blocked { color: var(--danger); }
  .badge.heavy { color: var(--warn); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block; }
  .avatar {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 10.5px;
    font-weight: 700;
    background: #2c3546;
    color: var(--text);
    margin-left: auto;
  }
  .avatar.agent { background: rgba(224, 179, 74, .2); }
  .status {
    margin-top: 7px;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .status.working { color: var(--agent); }
  /* The working chat's latest step, one line at a time, like Scribe's hidden chat pill: a new step
     slides the old line up and out while it blurs, and the new one up and in while it sharpens. */
  .step-text { display: grid; flex: 1 1 auto; min-width: 0; height: 16px; overflow: hidden; align-items: center; color: var(--muted); }
  .step-line {
    grid-area: 1 / 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    line-height: 16px;
    filter: blur(0px);
    transition: transform 520ms cubic-bezier(.22, 1, .36, 1), filter 520ms cubic-bezier(.22, 1, .36, 1), opacity 520ms cubic-bezier(0, 0, .35, 1);
  }
  .step-line.in { transform: translateY(12px); filter: blur(4px); }
  .step-line.out { transform: translateY(-12px); filter: blur(4px); opacity: 0; }
  .step-line.reason { font-style: italic; }
  .step-line.error { color: var(--danger); }
  @media (prefers-reduced-motion: reduce) {
    .step-line { transition: none; }
  }
  .status.blocked { color: var(--danger); }
  .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--agent); animation: pulse 1.4s ease-in-out infinite; flex: 0 0 auto; }
  @keyframes pulse { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.1); } }
  .review-row { display: flex; gap: 6px; margin-top: 8px; }
  .review-row button { flex: 1; padding: 5px 6px; font-size: 12px; font-weight: 600; }
  .approve { background: rgba(61, 214, 140, .15); color: var(--ok); }
  .approve:hover { background: rgba(61, 214, 140, .25); }
  .changes { background: rgba(224, 179, 74, .13); color: var(--warn); }
  .changes:hover { background: rgba(224, 179, 74, .23); }

  .menu {
    position: fixed;
    z-index: 70;
    min-width: 200px;
    background: rgba(18, 22, 30, .97);
    border-radius: 12px;
    box-shadow: var(--depth), 0 14px 40px rgba(0, 0, 0, .45);
    padding: 6px;
  }
  .menu > button, .menu .menu-row {
    display: flex;
    width: 100%;
    align-items: center;
    gap: 8px;
    text-align: left;
    padding: 7px 9px;
    border-radius: 8px;
  }
  .menu > button:hover:not(:disabled) { background: rgba(255, 255, 255, .07); }
  .menu .sep { height: 1px; background: var(--line); margin: 5px 4px; }
  .menu .label { color: var(--muted); font-size: 11.5px; padding: 6px 9px 2px; text-transform: uppercase; letter-spacing: .05em; }
  .menu .check-mark { width: 14px; color: var(--accent); }
  .menu input[type=number] { width: 70px; }
  .menu .note { color: var(--muted); font-size: 11.5px; padding: 0 9px 6px; }
  .menu .menu-sub { position: relative; }
  .menu .menu-sub > button { display: flex; width: 100%; align-items: center; gap: 8px; text-align: left; padding: 7px 9px; border-radius: 8px; }
  .menu .menu-sub:hover > button { background: rgba(255, 255, 255, .07); }
  .menu .sub-arrow { margin-left: auto; color: var(--muted); }
  .menu .submenu { display: none; position: absolute; top: -6px; left: 100%; min-width: 150px; }
  .menu .menu-sub:hover > .submenu, .menu .menu-sub:focus-within > .submenu { display: block; }
  .menu .menu-sub.flip > .submenu { left: auto; right: 100%; }
  .menu .prio-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); opacity: .35; }
  .menu .prio-dot.p1 { background: #6b7a93; opacity: 1; }
  .menu .prio-dot.p2 { background: var(--accent); opacity: 1; }
  .menu .prio-dot.p3 { background: var(--warn); opacity: 1; }
  .menu .prio-dot.p4 { background: var(--danger); opacity: 1; }
  .menu > button.danger-item { color: var(--danger); }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(8, 12, 20, .14);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 36px 16px 32px;
    z-index: 40;
    overflow: auto;
  }
  .modal {
    width: min(780px, 100%);
    background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
    background-color: rgba(10, 14, 22, .86);
    backdrop-filter: blur(22px) saturate(1.4);
    -webkit-backdrop-filter: blur(22px) saturate(1.4);
    border-radius: 18px;
    box-shadow: var(--depth), 0 18px 50px rgba(0, 0, 0, .25);
    padding: 20px 22px 18px;
    position: relative;
  }
  .modal:focus { outline: none; }
  .modal.drop-target { outline: 2px dashed var(--accent); outline-offset: -6px; }
  .modal-close {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 32px;
    height: 32px;
    background: rgba(255, 255, 255, .08);
    color: var(--muted);
    box-shadow: var(--depth);
    font-size: 18px;
  }
  .modal-close:hover { color: var(--text); }
  .m-head { padding-right: 40px; margin-bottom: 14px; }
  .m-num { color: var(--muted); font-size: 13px; margin-bottom: 2px; }
  .m-title {
    margin: 0;
    font-size: 21px;
    letter-spacing: -0.02em;
    line-height: 1.3;
    border-radius: 8px;
    padding: 3px 6px;
    margin-left: -6px;
    cursor: text;
    word-break: break-word;
  }
  .m-title:hover { background: rgba(255, 255, 255, .06); }
  #mTitle:focus-visible { box-shadow: 0 0 0 1px var(--accent); }
  .m-title-input {
    width: 100%;
    font: 650 21px/1.3 ui-sans-serif, system-ui, Segoe UI, sans-serif;
    letter-spacing: -0.02em;
    background: rgba(8, 12, 20, .3);
    border: 0;
    border-radius: 8px;
    padding: 3px 6px;
    margin-left: -6px;
    outline: none;
    box-shadow: 0 0 0 1px var(--accent);
  }
  .m-grid { display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 20px; }
  @media (max-width: 700px) { .m-grid { grid-template-columns: 1fr; } }
  .side { display: flex; flex-direction: column; gap: 10px; }
  .side label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  .side .field { width: 100%; }
  .section-label {
    font-size: 11.5px;
    font-weight: 650;
    color: var(--muted);
    letter-spacing: .05em;
    text-transform: uppercase;
    margin: 16px 0 7px;
    display: flex;

<script>
/**
 * Re-rendering a list without disturbing the rows that did not change.
 *
 * A node that is taken out of the document and put back (or replaced by a new copy) loses `:hover` until the
 * pointer next moves and drops its running transitions. A list rebuilt on every server event therefore blinks:
 * the hover highlight falls to nothing and fades back in, on all rows at once (#407).
 *
 * `scribeSyncChildren(parent, nodes)` makes `nodes` the children of `parent`, but keeps a child already there
 * when the new node would look the same, and moves only what is out of place. A kept child keeps its own
 * listeners: handlers on rows that may be kept must read live data, not what they closed over.
 */
(() => {
  // Set on a node after it is in the page (tooltip.js, hover card), so a fresh copy never has them.
  const IGNORED = new Set(["aria-description", "aria-describedby"]);
  // Their state lives in properties, which attributes don't show.
  const STATEFUL = new Set(["INPUT", "TEXTAREA", "SELECT"]);

  function attrs(el) {
    const out = new Map();
    for (const { name, value } of el.attributes) {
      if (IGNORED.has(name)) continue;
      out.set(name, name === "class" ? value.trim().split(/\s+/).join(" ") : value);
    }
    if (out.get("class") === "") out.delete("class");
    return out;
  }

  function same(a, b) {
    if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName) return false;
    if (a.nodeType !== Node.ELEMENT_NODE) return a.nodeValue === b.nodeValue;
    if (STATEFUL.has(a.nodeName) && !(a.nodeName === "INPUT" && a.type === "checkbox" && b.type === "checkbox" && a.checked === b.checked)) return false;
    if (a.childNodes.length !== b.childNodes.length) return false;
    const mine = attrs(a);
    const theirs = attrs(b);
    if (mine.size !== theirs.size) return false;
    for (const [name, value] of mine) {
      if (theirs.get(name) !== value) return false;
    }
    for (let i = 0; i < a.childNodes.length; i += 1) {
      if (!same(a.childNodes[i], b.childNodes[i])) return false;
    }
    return true;
  }

  window.scribeSyncChildren = function scribeSyncChildren(parent, nodes) {
    const wanted = nodes.flatMap((node) => (node.nodeType === Node.DOCUMENT_FRAGMENT_NODE ? [...node.childNodes] : [node]));
    const pool = [...parent.childNodes];
    const next = wanted.map((node) => {
      let at = pool.indexOf(node);
      if (at < 0) at = pool.findIndex((old) => same(old, node));
      return at < 0 ? node : pool.splice(at, 1)[0];
    });
    for (const old of pool) old.remove();
    let cursor = parent.firstChild;
    for (const node of next) {
      if (node === cursor) cursor = cursor.nextSibling;
      else parent.insertBefore(node, cursor);
    }
  };
})();

      overlay.classList.add("hidden");
      return;
    }
    // Rebuilding sections can shrink the dialog for a layout (folding comments measures them), which clamps the scroll.
    var scrollTop = overlay.scrollTop;
    var col = colOf(c);
    mNum.textContent = "#" + c.num + (c.archived ? " · archived" : "") + (col ? " · in " + col.title : "");
    if (!editingTitle) {
      setHtml(mTitle, linkText(c.title));
      mTitle.classList.remove("hidden");
      mTitleInput.classList.add("hidden");
    }

    var feed = c.status && c.status.kind === "working" ? cardSteps(c) : [];
    renderFeed(c, feed);
    region(mStatus, [c.id, c.status, feed.length > 0], function () { buildModalStatus(c, feed); });

    region(mdPreview, [c.id, c.description, c.images, scribe.state.cards, editingDesc], function () {
      if (editingDesc) return;
      if (c.description.trim()) {
        mdPreview.className = "md-preview";
        setHtml(mdPreview, renderMarkdown(c.description, c.images));
      } else {
        mdPreview.className = "md-preview placeholder";
        setHtml(mdPreview, escapeHtml("Click or press Enter to add a description. Markdown works; paste an image to embed it."));
      }
    });

    region(checklistEl, [c.id, c.checklist, editingCheck], function () { buildModalChecklist(c); });

    // images
    coverToggle.classList.toggle("hidden", !c.images.length);
    coverSwitch.checked = c.cover !== false;
    var imagesSig = JSON.stringify([c.id, c.images.map(function (im) { return [im.id, im.name, im.data]; })]);
    if (galleryEl._sig !== imagesSig) renderGallery(c, imagesSig);

    // comments: rebuilt only when what they show changed, so open (unfolded) comments and their images stay put
    if (expandedFor !== c.id) { expandedFor = c.id; expandedComments = {}; commentsEl._sig = null; }
    var commentsSig = JSON.stringify([c.id, c.title, c.thread, workerIdFor(c.assignee), defaultAskWorker(), imagesSig, c.comments.map(function (cm) {
      return [cm.id, cm.by, cm.text, ago(cm.at) + commentFate(cm), cm.followUp, cm.askThread];
    })]);
    if (commentsEl._sig !== commentsSig) renderComments(c, commentsSig);
    renderCommentFeeds(c);

    // Times read the clock ("5 min ago"): a new minute paints them again.
    region(mTimes, [c, col, scribe.state.columns, scribe.state.cards, scribe.state.labels, workers(),
      Math.floor(Date.now() / 60000)], function () { renderModalSide(c, col); });
    if (overlay.scrollTop !== scrollTop) overlay.scrollTop = scrollTop;
  }

  function buildModalStatus(c, feed) {

      mStatus.className = "m-status hidden";
    } else if (c.status && str(c.status.text || c.status.kind).trim()) {
      var kind = c.status.kind === "blocked" ? "blocked" : c.status.kind;
      mStatus.className = "m-status" + (kind === "blocked" ? " blocked" : "");
      mStatus.replaceChildren();
      if (kind === "working") mStatus.appendChild(el("span", "pulse"));
      mStatus.appendChild(el("span", null, "🤖 " + (kind === "blocked" ? "Blocked: " : "") + str(c.status.text || "Working…")));
      var clear = el("button", "clear", "Clear");
      clear.type = "button";
      clear.addEventListener("click", function () { updateCard(c.id, function (x) { delete x.status; return x; }); });

  function buildModalChecklist(c) {

    clCount.textContent = c.checklist.length ? doneCount + "/" + c.checklist.length : "";

      tick.checked = item.done;
      tick.addEventListener("change", function () {
        updateCard(c.id, function (x) {
          x.checklist = x.checklist.map(function (i) { return i.id === item.id ? Object.assign({}, i, { done: tick.checked }) : i; });

  function renderComments(c, sig) {

    var oldImages = loadedImages(commentsEl);
    commentsEl.replaceChildren();
    c.comments.forEach(function (cm, i) {
      var box = el("div", "comment" + (isUserComment(cm.by) ? "" : " agent"));
      var who = el("div", "who");

      var copy = el("button", "copy");

      copy.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        if (navigator.clipboard && navigator.clipboard.writeText) {

      if (i === c.comments.length - 1 && isUserComment(cm.by) && offer) box.appendChild(followUpButtons(c, cm));

  function renderModalSide(c, col) {

  function saveTitle() {

    mTitleInput.classList.add("hidden");
    mTitle.classList.remove("hidden");
    if (openId && title) {

    }
    renderModal();
  }

  function startEditTitle() {
    var c = openId && card(openId);

    if (editingDesc) saveDescription();

      mTitleInput.value = c.title;

      mTitleInput.classList.remove("hidden");

    mTitleInput.select();
  }
  function startEditDesc() {
    var c = openId && card(openId);
    if (!c) return;
    if (editingTitle) saveTitle();
    if (!editingDesc) {
      editingDesc = true;
      mdEditor.value = c.description;

      mdEditor.classList.remove("hidden");

  mTitle.addEventListener("click", function (e) {
    if (e.target.closest && e.target.closest("a")) return;
    startEditTitle();
  });
  mTitle.addEventListener("keydown", function (e) {
    if (e.target !== mTitle || e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      startEditTitle();
    }
  });
  mTitleInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); mTitleInput.blur(); }

    if (e.key === "Tab" && !e.shiftKey) {
      e.preventDefault();
      saveTitle();
      startEditDesc();
    }
  });
  mTitleInput.addEventListener("blur", function () { if (editingTitle) saveTitle(); });

  mdPreview.addEventListener("click", function (e) {

    if (e.target.tagName === "A") return;

  });
  mdPreview.addEventListener("keydown", function (e) {
    if (e.target !== mdPreview || e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      startEditDesc();
    } else if (e.key.length === 1) {
      e.preventDefault();
      startEditDesc();
      insertAtCursor(mdEditor, e.key);
      scheduleEditorSave();
    }
  });
  mdEditor.addEventListener("blur", function () { if (editingDesc) saveDescription(); });
  mdEditor.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { e.stopPropagation(); mdEditor.blur(); }
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); mdEditor.blur(); }
    if (e.key === "Tab" && e.shiftKey) {
      e.preventDefault();
      saveDescription();
      startEditTitle();
    }
  });

  var editingCheck = null;
  var lastCheckToggle = null;
  function toggleCheck(cardId, itemId) {
    updateCard(cardId, function (x) {
      x.checklist = x.checklist.map(function (i) { return i.id === itemId ? Object.assign({}, i, { done: !i.done }) : i; });
      return x;
    });
  }
  // One listener on the list, since the first click re-renders the row the second click lands on.
  // The first click ticks at once; a second click of a double-click undoes that tick and edits.
  checklistEl.addEventListener("click", function (e) {
    var span = e.target.closest && e.target.closest("li > span");
    if (!span || editingCheck || !openId) return;
    var id = span.parentNode.dataset.id;
    var cardId = openId;
    if (e.detail >= 2) {
      var undo = lastCheckToggle && lastCheckToggle.id === id && Date.now() - lastCheckToggle.at < 700;
      lastCheckToggle = null;
      if (e.detail > 2) return;
      if (undo) toggleCheck(cardId, id);
      var c = card(cardId);
      var item = c && c.checklist.find(function (i) { return i.id === id; });
      var row = checklistEl.querySelector('li[data-id="' + id + '"] > span');
      if (item && row) editCheckItem(cardId, item, row);
      return;
    }
    toggleCheck(cardId, id);
    lastCheckToggle = { id: id, at: Date.now() };
  });
  /** Swap an item's text for an input: Enter or click-away saves, Esc cancels, empty removes the item. */
  function editCheckItem(cardId, item, span) {
    editingCheck = item.id;
    // The input replaces the row outside the checklist's region: it is built again afterwards.
    checklistEl._regionSig = null;
    var input = el("input", "field ck-edit");
    input.value = item.text;
    span.replaceWith(input);
    input.focus();
    input.select();
    var done = false;
    function finish(save) {
      if (done) return;
      done = true;
      editingCheck = null;
      var textValue = input.value.trim();
      if (!save || textValue === item.text) return renderModal();
      updateCard(cardId, function (x) {
        x.checklist = textValue
          ? x.checklist.map(function (i) { return i.id === item.id ? Object.assign({}, i, { text: textValue }) : i; })
          : x.checklist.filter(function (i) { return i.id !== item.id; });
        return x;
      });
    }
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); finish(true); }
      else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); finish(false); }
    });
    input.addEventListener("blur", function () { finish(true); });
  }

  clInput.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    var text = clInput.value.trim();
    if (!text || !openId) return;
    clInput.value = "";
    updateCard(openId, function (x) {
      x.checklist = x.checklist.concat([{ id: newId("ck"), text: text, done: false }]);
      return x;
    });
  });
  coverSwitch.addEventListener("change", function () {
    if (!openId) return;
    updateCard(openId, function (x) {
      if (coverSwitch.checked) delete x.cover;
      else x.cover = false;
      return x;
    });
  });

  function postComment() {
    var text = commentBox.value.trim();
    if (!text || !openId) return false;
    commentBox.value = "";
    saveCommentDraft();
    var cmId = newId("cm");
    updateCard(openId, function (x) {
      x.comments = x.comments.concat([{ id: cmId, by: "user", at: Date.now(), text: text }]);
      return x;
    });
    var commented = card(openId);
    scribe.signal("comment", { card: openId, num: commented ? commented.num : null });
    if (commented) handOffComment(commented, cmId, text);
    return true;
  }

  // ---------- comments to agent chats (#182) ----------
  // A comment on a card an agent chat holds goes into that chat's running turn (steered in, or queued
  // behind it when its provider can't steer). On a card whose chat has finished, the comment offers
  // Continue: that chat reads the card again and goes on, since it already has the context.
  function hasCardApi() {
    return Boolean(scribe.agent && typeof scribe.agent.card === "function");
  }
  function setComment(cardId, cmId, fields) {
    updateCard(cardId, function (x) {
      x.comments = x.comments.map(function (cm) { return cm.id === cmId ? Object.assign({}, cm, fields) : cm; });
      return x;
    });
  }
  function defaultAskWorker() {
    var id = str(settings().defaultWorker);
    return hasWorkerApi() && worker(id) ? id : null;
  }
  function askPrompt(w, c, text) {
    var lines = [
      "You are answering a question about #" + c.num + " on the Kanban board " + boardTitle() + " (Scribe page id " + scribe.id + ").",
      "The full card snapshot and its images accompany this message; no initial get is needed. Use page_action on that board to comment with your answer. This is a one-off question or quick investigation, not a request to implement the issue.",
      "The card has NOT been claimed or assigned to you. Do not claim, finish, release, move, reassign, or change its status unless the user's comment explicitly asks you to. Do not take other cards.",
      "Short answers can be comments. For investigation or design, create a report page in the background and post a short comment linking it with a peek link ([[peek:scribe:page-key]]), instead of a long comment. Only use page keys you created or found.",
      "Shared and worker instructions (apply them within the question's scope):",
      workerInstructions(w),
      "", "Card: #" + c.num + " " + c.title, "", "The user's question:", text,
      "", "Answer the question, then end your turn."
    ];
    var prompt = lines.join("\n");
    return prompt;
  }
  var askingComments = {};
  function askComment(cardId, cmId, text) {
    var c = card(cardId);
    var id = defaultAskWorker();
    var w = id && worker(id);
    if (!c || !w || askingComments[cmId]) return Promise.resolve(false);
    if (FOLDER_MODES[workerMode(w)] && !str(w.cwd).trim()) {
      setHint("Set a folder for the default worker first.", true);
      setComment(cardId, cmId, { followUp: "askOffer" });
      return Promise.resolve(false);
    }
    askingComments[cmId] = workerName(w);
    renderLater();
    setHint("Asking " + workerName(w) + " about #" + c.num + "…");
    return loadAgentOptions().then(function () {
      var opts = workerOpts(w, c);
      opts.title = ("Ask · #" + c.num + " " + c.title).slice(0, 120);
      opts.worktree = false;
      opts.cardContext = c.num;
      opts.run = { tag: "ask:" + id, data: { worker: id, card: c.num, ask: true }, merge: false, resumePrompt: "Continue answering the user's question about #" + c.num + ". Do not claim, move, reassign or finish the card unless explicitly requested. Post your answer on the card, using a linked peek report page for longer investigations." };
      return scribe.agent.start(askPrompt(w, c, text), opts);
    }).then(function (r) {
      if (!r || !r.ok) throw new Error(launchError(r));
      if (r.threadId && !threadStatus[r.threadId]) threadStatus[r.threadId] = { status: "running", queued: 0 };
      setComment(cardId, cmId, { followUp: "asked", askThread: r.threadId });
      setHint(workerName(w) + " is answering about #" + c.num + ".");
      return true;
    }).catch(function (err) {
      setComment(cardId, cmId, { followUp: "askOffer" });
      setHint(str(err && err.message) || "Could not ask the agent.", true);
      return false;
    }).finally(function () { delete askingComments[cmId]; renderLater(); });
  }
  /** Keep Ask progress under its source comment, independent of the card's worker and workflow. */
  function renderCommentFeeds(c) {
    c.comments.forEach(function (cm) {
      var box = Array.prototype.find.call(commentsEl.querySelectorAll(".comment-feed"), function (n) { return n.dataset.askComment === cm.id; });
      if (!box) return;
      var tid = cm.askThread;
      if (tid && !threadStatus[tid] && scribe.agent && typeof scribe.agent.get === "function") {
        threadStatus[tid] = { status: "idle", unknown: true };
        scribe.agent.get(tid).then(function (r) {
          if (r && r.ok && r.thread) threadStatus[tid] = threadState(r.thread);
          else threadStatus[tid] = { status: "idle", gone: true };
          renderLater();
        }).catch(function () { threadStatus[tid] = { status: "idle", gone: true }; renderLater(); });
      }
      var steps = liveSteps(tid);
      var t = tid && threadStatus[tid];
      var starting = askingComments[cm.id];
      var active = t && !t.gone && (t.unknown || t.status !== "idle" || t.queued > 0 || (t.run && t.run.phase !== "ended"));
      box.classList.toggle("hidden", !starting && !active);
      if (!starting && !active) return;
      var waiting = t && t.run && t.run.phase === "waiting";
      var step = waiting ? { key: "waiting", text: "Waiting for usage limit to reset…" } : steps[steps.length - 1];
      setStepLine(box.lastChild, step || { key: "ask", text: starting ? "Asking " + starting + "…" : "Agent is answering…" });
    });
  }
  function handOffComment(c, cmId, text) {
    if (!hasCardApi()) return;
    if (!workerIdFor(c.assignee)) {
      if (defaultAskWorker()) setComment(c.id, cmId, { followUp: "offer" });
      return;
    }
    var holder = c.claim && !c.claim.stale && c.claim.thread;
    if (!holder) {
      if (c.thread) setComment(c.id, cmId, { followUp: "offer" });
      return;
    }

  // ---------- images ----------
  /** Older boards kept image bytes in state. Save them before replacing any reference. */
  async function migrateLegacyImages() {
    var pending = [];
    allCards().forEach(function (c) {
      c.images.forEach(function (im) {
        if (/^data:image\//i.test(im.data)) pending.push({ card: c.id, image: im });
      });
    });
    var failed = false;
    // One upload at a time bounds memory even on boards full of attachments.
    for (var i = 0; i < pending.length; i++) {
      var item = pending[i], before = item.image;
      try {
        var blob = await fetch(before.data).then(function (response) { return response.blob(); });
        var asset = await scribe.saveAsset(blob, { name: before.name || "image" });
        if (!asset) continue; // The bridge suppresses writes during preview capture.
        var current = card(item.card);
        if (!current || !current.images.some(function (im) { return im.id === before.id && im.data === before.data; })) continue;
        updateCard(item.card, function (c) {
          c.images = c.images.map(function (im) {
            return im.id === before.id && im.data === before.data ? Object.assign({}, im, { data: asset.url }) : im;
          });
          return c;
        });
      } catch (e) {
        // Keep the original readable and try it again next time the board opens.
        failed = true;
      }
    }
    if (failed) setHint("Some older images could not be moved to storage. They are still available; reopen the board to retry.", true);
  }

  function addImageFiles(files, intoDescription) {
    var c = openId && card(openId);
    if (!c) return;
    var targetId = c.id;
    Array.prototype.forEach.call(files, function (file) {
      if (!/^image\/(png|jpe?g|gif|webp)$/i.test(file.type)) {
        setHint("Use png, jpeg, gif, or webp.", true);
        return;
      }
      setHint("Adding image…");
      shrinkImage(file, function (err, blob) {
        if (err || !blob) return setHint("Could not read that image.", true);
        scribe.saveAsset(blob, { name: file.name || "image" }).then(function (asset) {

  // ---------- markdown ----------

  // ---------- suggested labels and priority ----------
  // With the board's setting on, a card that is created or whose title or description changes
  // while this board is open is put to the classifier (scribe.ml): one yes/no question per label
  // the card lacks, and one choice for its priority when it has none. Watching the state covers
  // every way a card arrives or changes: this page, another window, an agent's action. The answer
  // is kept on the card as card.suggest ({ labels?, priority?, no? }) and shown as chips; only the
  // user's click turns one into a label or a priority.
  var SUGGEST_WAIT_MS = 1500;
  /** More cards than this changing at once is an import or a restore, not someone writing cards. */
  var SUGGEST_BULK = 8;
  var SUGGEST_LABELS = 30, SUGGEST_SHOWN = 3, SUGGEST_YES = 0.75, SUGGEST_PRIORITY = 0.6;
  var SUGGEST_TEXT = 8000;
  var PRIORITY_NAMES = ["unspecified", "low", "medium", "high", "urgent"];
  var PRIORITY_OPTIONS = {
    unspecified: "The card does not say how urgent or important it is",
    low: "Nice to have; can wait a long time",
    medium: "Ordinary work to do in its turn",
    high: "Important; should be done soon",
    urgent: "Something is broken or blocked and needs attention now"
  };
  var suggestSeen = null, suggestTimers = {}, suggestQueue = [], suggestBusy = false;
  /** suggestDenied: this PC refused the permission; suggestAsking: the user is being asked for it. */
  var suggestDenied = false, suggestAsking = false;

  function suggestOn() {
    return Boolean(settings().suggest) && Boolean(scribe.ml) && !suggestDenied;
  }
  /** Find the cards that are new or whose text changed since the last look. The first look only takes stock. */
  function suggestScan() {
    var first = !suggestSeen, next = {}, changed = [];
    allCards().forEach(function (c) {
      var was = suggestSeen && suggestSeen[c.id];
      next[c.id] = { title: c.title, description: c.description };
      if (!first && (!was || was.title !== c.title || was.description !== c.description)) changed.push(c.id);
    });
    suggestSeen = next;
    if (!changed.length || changed.length > SUGGEST_BULK || !suggestOn()) return;
    changed.forEach(function (id) {
      // Typing saves as it goes: ask once it has been quiet for a moment.
      clearTimeout(suggestTimers[id]);
      suggestTimers[id] = setTimeout(function ready() {
        // Autosaves keep the shared description current; classify once editing ends.
        if (editingDesc && openId === id) {
          suggestTimers[id] = setTimeout(ready, SUGGEST_WAIT_MS);
          return;
        }
        delete suggestTimers[id];

      }, SUGGEST_WAIT_MS);
    });
  }

    }).slice(0, SUGGEST_LABELS).forEach(function (l, i) {

    if (!sharedInstructionsBack.classList.contains("hidden")) closeSharedInstructions();
    else if (!stopBack.classList.contains("hidden")) closeStop();
    else if (!workerBack.classList.contains("hidden")) closeWorker();
    else if (!workersPop.classList.contains("hidden") && !menuEl) closeWorkersPanel();
    else return;
    e.preventDefault();
    e.stopImmediatePropagation();
  }, true);

  // ---------- toolbar ----------
  var searchTimer = 0;
  searchEl.addEventListener("input", function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () { setView({ q: searchEl.value }); }, 150);
  });
  fDue.addEventListener("change", function () { setView({ due: fDue.value }); });
  clearFilterBtn.addEventListener("click", function () {
    searchEl.value = "";
    scribe.setLocal({ view: {} });
    render();
  });

  // ---------- global keys ----------
  $("mClose").addEventListener("click", closeCard);
  overlay.addEventListener("pointerdown", function (e) {
    if (e.target === overlay) closeCard();
  });
  document.addEventListener("pointerdown", function (e) {
    if (menuEl && !menuEl.contains(e.target)) closeMenu();
  });
  // Closed after the click is handled, so "+ Add a card" in another column still gets its click.
  document.addEventListener("click", function (e) {
    if (!composerCol || (e.target.closest && e.target.closest(".composer"))) return;
    composerCol = null;
    setTimeout(function () {
      if (!composerCol && boardEl.querySelector(".composer")) render();
    }, 0);
  }, true);

  // A vertical wheel scrolls the board sideways, except over a column list that has its own scrollbar.
  boardEl.addEventListener("wheel", function (e) {
    if (e.ctrlKey || drag || boardEl.scrollWidth <= boardEl.clientWidth) return;
    if (Math.abs(e.deltaX) >= Math.abs(e.deltaY)) return;
    var list = e.target.closest && e.target.closest(".cards");
    if (list && list.scrollHeight > list.clientHeight + 1) return;
    if (e.target.closest && e.target.closest("textarea")) return;
    var unit = e.deltaMode === 1 ? 40 : e.deltaMode === 2 ? boardEl.clientWidth : 1;
    smoothScrollBoard(e.deltaY * unit);
    e.preventDefault();
  }, { passive: false });

  // Wheel steps move a target; the board eases toward it, so fast wheeling adds up instead
  // of restarting. Anything else moving the board mid-glide (scrollbar, drag) wins.
  var REDUCED_MOTION = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var glide = null;
  function smoothScrollBoard(dx) {
    var max = boardEl.scrollWidth - boardEl.clientWidth;
    if (REDUCED_MOTION) {
      boardEl.scrollLeft = clamp(boardEl.scrollLeft + dx, 0, max);
      return;
    }
    if (!glide) {
      glide = { pos: boardEl.scrollLeft, target: boardEl.scrollLeft, last: performance.now() };
      requestAnimationFrame(stepGlide);
    }
    glide.target = clamp(glide.target + dx, 0, max);
  }
  function stepGlide(now) {
    if (!glide) return;
    if (Math.abs(boardEl.scrollLeft - glide.pos) > 2) {
      glide = null;
      return;
    }
    var diff = glide.target - glide.pos;
    if (Math.abs(diff) < 1) {
      boardEl.scrollLeft = glide.target;
      glide = null;
      return;
    }
    // A frame's timestamp can precede the wheel event that started the glide.
    var dt = Math.min(64, now - glide.last);
    if (dt <= 0) {
      requestAnimationFrame(stepGlide);
      return;
    }
    glide.last = now;
    var step = diff * (1 - Math.exp(-dt / 65));
    if (Math.abs(step) < 0.5) step = Math.sign(diff) * Math.min(Math.abs(diff), 0.5);
    glide.pos += step;
    boardEl.scrollLeft = glide.pos;
    // scrollLeft snaps to device pixels; follow where it actually landed.
    glide.pos = Math.abs(boardEl.scrollLeft - glide.pos) <= 1 ? glide.pos : boardEl.scrollLeft;
    requestAnimationFrame(stepGlide);
  }
  function dialogFocusables(root) {
    var nodes = root.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]):not([type="hidden"]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])');
    var out = [];
    for (var i = 0; i < nodes.length; i++) {
      var node = nodes[i];
      if (node.offsetWidth || node.offsetHeight || node.getClientRects().length) out.push(node);
    }
    return out;
  }
  function trapDialogTab(e, root) {
    if (e.key !== "Tab" || e.defaultPrevented) return;
    var list = dialogFocusables(root);
    if (!list.length) {
      e.preventDefault();
      return;
    }
    var first = list[0], last = list[list.length - 1];
    var active = document.activeElement;
    if (e.shiftKey) {
      if (active === root || active === first || !root.contains(active)) {
        e.preventDefault();
        last.focus();
      }
    } else if (active === last || !root.contains(active)) {
      e.preventDefault();
      first.focus();
    }
  }
  function topDialog() {
    var ids = ["sharedInstructionsBack", "stopBack", "workerBack", "settingsBack", "confirmBack"];
    for (var i = 0; i < ids.length; i++) {
      var back = $(ids[i]);
      if (back && !back.classList.contains("hidden")) {
        return back.querySelector("[role='dialog'], [role='alertdialog']");
      }
    }
    if (!overlay.classList.contains("hidden")) return modal;
    return null;
  }
  document.addEventListener("keydown", function (e) {
    var dlg = topDialog();
    if (dlg) trapDialogTab(e, dlg);
  });
  document.addEventListener("keydown", function (e) {
    var typing = document.activeElement && (document.activeElement.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName));
    if (e.key === "Escape") {
      if (!lightbox.classList.contains("hidden")) { lightbox.classList.add("hidden"); return; }
      if (menuEl) { closeMenu(); return; }
      if (openId && !typing) { closeCard(); return; }
      if (!archiveEl.classList.contains("hidden") && !typing) { archiveEl.classList.add("hidden"); archiveBtn.classList.remove("on"); }
      return;
    }
    if (e.key === "/" && !typing && !openId) {
      e.preventDefault();
      searchEl.focus();
    }
  });

  /**
   * The board's bookkeeping, apart from painting: label and priority suggestions for new or edited
   * cards, the status of workers' threads, and chats left unmerged. It follows every state change,
   * the board's own writes included, whether or not anything is painted.
   */
  function bookkeeping() {
    suggestScan();
    refreshWorkerThreads();
    sweepUnmerged();
  }
  scribe.onChange(function (state, info) {
    // The board's own writes paint here, once the code that made them has finished.
    if (info && info.source === "local") {
      bookkeeping();
      if (scribe.state !== renderedState) render();
      return;
    }
    ensureShape();
    bookkeeping();
    // Viewer-local filter changes still paint immediately, including ones restored by the host.
    if (JSON.stringify(view()) !== renderedView) render();
    else renderLater();
  }, { local: true });
  ensureShape();
  bookkeeping();
  render();
  migrateLegacyImages();
  // A link to one card (scribe:board-key#card=12, or a search hit): open its dialog.
  if (scribe.onOpen) scribe.onOpen(function (request) {
    var num = Number(request.args.card || request.args.record);
    var target = num ? byNum(num) : null;
    if (target && target.id !== openId) openCard(target.id);
  });
  loadWorkerLimits();
})();
</script>
</body>
</html>
