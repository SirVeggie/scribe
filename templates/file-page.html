<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>File</title>
<!-- File pages (#654): Scribe serves this viewer for every page with a file on its tab. -->
<script src="/vendor/highlight.js"></script>
<script src="/vendor/marked.js"></script>
<script src="/vendor/purify.js"></script>
<style>
  :root {
    color-scheme: dark;
    --bg: #1a1a1d;
    --panel: #202024;
    --text: #e8e8ea;
    --muted: #8e8e96;
    --border: rgba(255, 255, 255, 0.08);
    --accent: #c9c9d0;
    --accent-soft: rgba(255, 255, 255, 0.07);
    --code-bg: #131315;
    --warn: #e0b45c;
    --danger: #e07a7a;
    --mono: "Cascadia Code", "Cascadia Mono", Consolas, ui-monospace, monospace;
    --hl-keyword: #c792ea;
    --hl-string: #c3e88d;
    --hl-number: #f78c6c;
    --hl-comment: #7d8796;
    --hl-title: #82aaff;
    --hl-type: #ffcb6b;
    --hl-attr: #89ddff;
    --hl-meta: #b0a4e3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.45 Inter, "Segoe UI", system-ui, sans-serif;
  }
  .hidden { display: none !important; }

  /* ---------- bar ---------- */
  .bar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 38px;
    padding: 0 10px 0 14px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    min-width: 0;
  }
  .name { font-weight: 600; white-space: nowrap; }
  .dirty {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--warn);
    flex: none;
  }
  .path {
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    direction: rtl;
    text-align: left;
    min-width: 0;
    flex: 1 1 auto;
  }
  .path bdi { direction: ltr; unicode-bidi: isolate; }
  .tag {
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 99px;
    border: 1px solid var(--border);
    color: var(--muted);
    white-space: nowrap;
  }
  .actions { display: flex; align-items: center; gap: 6px; flex: none; }
  button {
    font: inherit;
    font-size: 12px;
    color: var(--text);
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border);
    border-radius: 7px;
    height: 26px;
    padding: 0 10px;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover { background: rgba(255, 255, 255, 0.1); }
  button:disabled { opacity: 0.45; cursor: default; background: rgba(255, 255, 255, 0.06); }
  button.primary { background: rgba(255, 255, 255, 0.14); }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: transparent; color: var(--muted); }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button.on { background: rgba(255, 255, 255, 0.12); color: var(--text); }

  /* ---------- banner ---------- */
  .banner {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 14px;
    background: rgba(224, 180, 92, 0.12);
    border-bottom: 1px solid rgba(224, 180, 92, 0.3);
    font-size: 12.5px;
  }
  .banner .grow { flex: 1; }

  /* ---------- main ---------- */
  main { flex: 1 1 auto; position: relative; min-height: 0; }
  .pane { position: absolute; inset: 0; }

  /* editor: CodeMirror (templates/file-editor.js), loaded when a text file opens */
  .editor { background: var(--code-bg); }
  .editor .cm-editor { height: 100%; }
  button.toggle.on { background: rgba(255, 255, 255, 0.14); color: var(--text); }
  button.toggle { color: var(--muted); }

  /* highlight.js: code blocks in rendered markdown */
  .hljs-keyword, .hljs-selector-tag, .hljs-doctag { color: var(--hl-keyword); }
  .hljs-string, .hljs-regexp, .hljs-template-tag, .hljs-selector-attr { color: var(--hl-string); }
  .hljs-number, .hljs-literal, .hljs-symbol, .hljs-bullet { color: var(--hl-number); }
  .hljs-comment, .hljs-quote { color: var(--hl-comment); font-style: italic; }
  .hljs-title, .hljs-section, .hljs-name, .hljs-selector-id { color: var(--hl-title); }
  .hljs-type, .hljs-built_in, .hljs-title.class_, .hljs-selector-class { color: var(--hl-type); }
  .hljs-attr, .hljs-attribute, .hljs-property, .hljs-variable, .hljs-template-variable, .hljs-selector-pseudo { color: var(--hl-attr); }
  .hljs-meta, .hljs-tag, .hljs-subst { color: var(--hl-meta); }
  .hljs-addition { color: #9ad48b; }
  .hljs-deletion { color: var(--danger); }
  .hljs-emphasis { font-style: italic; }
  .hljs-strong { font-weight: 600; }

  /* markdown, rendered: each block edits in place */
  .md { overflow: auto; }
  .md-doc {
    max-width: 860px;
    margin: 0 auto;
    padding: 28px 40px 40vh;
    font-size: 15px;
    line-height: 1.6;
  }
  .blk { border-radius: 6px; margin: 0 -10px; padding: 0 10px; cursor: text; }
  .blk:hover { background: rgba(255, 255, 255, 0.025); }
  .blk > :first-child { margin-top: 0.4em; }
  .blk > :last-child { margin-bottom: 0.4em; }
  .blk-edit {
    display: block;
    width: calc(100% + 20px);
    margin: 4px -10px;
    padding: 8px 10px;
    resize: none;
    overflow: hidden;
    border: 0;
    border-radius: 6px;
    outline: none;
    background: var(--code-bg);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.14);
    color: var(--text);
    font: 13px/20px var(--mono);
    tab-size: 4;
  }
  .md-end { min-height: 30vh; cursor: text; }
  .md-empty { color: var(--muted); padding: 6px 0; }
  .md-doc h1, .md-doc h2, .md-doc h3, .md-doc h4 { line-height: 1.25; font-weight: 650; }
  .md-doc h1 { font-size: 1.8rem; letter-spacing: -0.02em; }
  .md-doc h2 { font-size: 1.35rem; }
  .md-doc h3 { font-size: 1.1rem; }
  .md-doc a { color: #82aaff; }
  .md-doc code { font: 0.88em var(--mono); background: var(--code-bg); padding: 0.1em 0.35em; border-radius: 5px; }
  .md-doc pre { background: var(--code-bg); border: 1px solid var(--border); padding: 12px 14px; border-radius: 10px; overflow: auto; }
  .md-doc li:has(> .task-box), .md-doc li:has(> p > .task-box) { list-style: none; }
  .md-doc .task-box { margin: 0 0.45em 0 -1.4em; vertical-align: -2px; accent-color: var(--accent); cursor: pointer; }
  .md-doc .code-block { position: relative; }
  .md-doc .code-copy { position: absolute; top: 7px; right: 7px; padding: 2px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--muted); font: inherit; font-size: 12px; cursor: pointer; opacity: 0; transition: opacity 0.12s; }
  .md-doc .code-block:hover .code-copy, .md-doc .code-copy:focus-visible { opacity: 1; }
  .md-doc .code-copy:hover { color: var(--text); }
  .md-doc pre code { background: none; padding: 0; font-size: 13px; }
  .md-doc blockquote { margin: 0.6em 0; padding: 0.1em 0.9em; border-left: 3px solid var(--accent); color: var(--muted); }
  .md-doc table { border-collapse: collapse; margin: 0.6em 0; }
  .md-doc th, .md-doc td { border: 1px solid var(--border); padding: 5px 10px; text-align: left; }
  .md-doc th { background: rgba(255, 255, 255, 0.04); }
  .md-doc img { max-width: 100%; }
  .md-doc hr { border: 0; border-top: 1px solid var(--border); }

  /* html, rendered */
  .htmlview { background: #fff; }
  .htmlview iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }

  /* image */
  .imgview {
    overflow: hidden;
    cursor: grab;
    background-color: #151517;
    background-image: linear-gradient(45deg, #1d1d20 25%, transparent 25%), linear-gradient(-45deg, #1d1d20 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #1d1d20 75%), linear-gradient(-45deg, transparent 75%, #1d1d20 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0;
  }
  .imgview.panning { cursor: grabbing; }
  .imgview img {
    position: absolute;
    left: 0; top: 0;
    transform-origin: 0 0;
    user-select: none;
    -webkit-user-drag: none;
    image-rendering: auto;
  }
  .imgview.pixelated img { image-rendering: pixelated; }
  /* pdf: pages drawn by pdf.js, with a text layer for selecting and copying */
  .pdfview { overflow: auto; background: #151517; }
  .pdf-pages { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; width: max-content; min-width: 100%; box-sizing: border-box; }
  .pdf-page { position: relative; flex: none; background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5); }
  .pdf-page canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .textLayer { color-scheme: only light; position: absolute; inset: 0; overflow: clip; line-height: 1; text-align: initial; text-size-adjust: none; forced-color-adjust: none; transform-origin: 0 0; z-index: 0; }
  .textLayer :is(span, br) { color: transparent; position: absolute; white-space: pre; cursor: text; transform-origin: 0% 0%; user-select: text; }
  .textLayer > :not(.markedContent), .textLayer .markedContent span:not(.markedContent) { z-index: 1; --font-height: 0; font-size: calc(var(--total-scale-factor) * var(--font-height)); --scale-x: 1; --rotate: 0deg; transform: rotate(var(--rotate)) scaleX(var(--scale-x)); }
  .textLayer .markedContent { display: contents; }
  .textLayer span[role="img"] { user-select: none; cursor: default; }
  .textLayer ::selection { background: rgba(0, 100, 255, 0.3); color: transparent; }
  .textLayer .endOfContent { display: block; position: absolute; inset: 100% 0 0; z-index: 0; cursor: default; user-select: none; }
  .zoom-label { min-width: 48px; text-align: center; color: var(--muted); font-size: 12px; }

  /* messages */
  .message {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-align: center;
    padding: 24px;
  }
  .message h2 { margin: 0; font-size: 17px; font-weight: 600; }
  .message p { margin: 0; color: var(--muted); max-width: 560px; overflow-wrap: anywhere; }

  /* status */
  .status {
    flex: none;
    display: flex;
    gap: 14px;
    align-items: center;
    height: 24px;
    padding: 0 14px;
    border-top: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    font-size: 11.5px;
    white-space: nowrap;
    overflow: hidden;
  }
  .status .grow { flex: 1; }
  .status .err { color: var(--danger); overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
  <header class="bar">
    <span class="name" id="name">File</span>
    <span class="dirty hidden" id="dirty" role="img" aria-label="Unsaved changes" data-tooltip="Unsaved changes"></span>
    <span class="tag hidden" id="copyTag" data-tooltip="A dropped file is a copy kept in Scribe. Save as writes it to a folder on disk.">Copy</span>
    <span class="path" id="path"></span>
    <div class="actions">
      <div class="seg hidden" id="modeSeg" role="group" aria-label="View">
        <button type="button" data-mode="render">Preview</button>
        <button type="button" data-mode="source">Source</button>
      </div>
      <div class="actions hidden" id="zoomBar">
        <button type="button" id="zoomOut" aria-label="Zoom out">−</button>
        <span class="zoom-label" id="zoomLabel">100%</span>
        <button type="button" id="zoomIn" aria-label="Zoom in">+</button>
        <button type="button" id="zoomFit">Fit</button>
        <button type="button" id="zoomOne">1:1</button>
      </div>
      <button type="button" class="toggle hidden" id="wrapBtn" aria-pressed="false" data-tooltip="Word wrap (Alt+Z)">Wrap</button>
      <button type="button" class="hidden" id="prettify">Prettify</button>
      <button type="button" class="hidden" id="save">Save</button>
      <button type="button" class="hidden" id="saveAs">Save as</button>
    </div>
  </header>
  <div class="banner hidden" id="banner">
    <span class="grow" id="bannerText"></span>
    <button type="button" id="bannerReload">Reload</button>
    <button type="button" id="bannerOverwrite">Overwrite</button>
    <button type="button" id="bannerUndo">Undo</button>
    <button type="button" id="bannerClose" aria-label="Dismiss">×</button>
  </div>
  <main id="main">
    <div class="pane message" id="loading"><p>Opening…</p></div>
    <div class="pane editor hidden" id="editorPane"></div>
    <div class="pane md hidden" id="mdPane"><div class="md-doc" id="mdDoc"></div></div>
    <div class="pane htmlview hidden" id="htmlPane"></div>
    <div class="pane imgview hidden" id="imgPane"><img id="img" alt=""></div>
    <div class="pane pdfview hidden" id="pdfPane"><div class="pdf-pages" id="pdfPages"></div></div>
    <div class="pane message hidden" id="messagePane"><h2 id="msgTitle"></h2><p id="msgText"></p><p id="msgPath"></p></div>
  </main>
  <footer class="status" id="status">
    <span id="stPos"></span>
    <span class="err" id="stErr"></span>
    <span class="grow"></span>
    <span id="stLang"></span>
    <span id="stEnc"></span>
    <span id="stEol"></span>
    <span id="stSize"></span>
  </footer>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var editorPane = $("editorPane");
  var editor = null;     // ScribeEditor's handle, once a text file opened
  var mdDoc = $("mdDoc"), mdPane = $("mdPane");

  // Unsaved text survives a reload in this viewer's local state, up to its size limit.
  var DRAFT_MAX = 48 * 1024;
  var LANG_LABEL = { text: "Plain text", markdown: "Markdown", json: "JSON", html: "HTML", image: "Image", pdf: "PDF" };

  var file = null;       // the last read: { path, name, kind, lang, size, mtime, copy, eol, bom }
  var saved = "";        // the text on disk
  var mode = "source";   // markdown / html: render or source
  var busy = false;

  if (!window.scribe || !scribe.file) {
    showMessage("Reload this tab", "This page needs a newer Scribe to open its file.", "");
    return;
  }

  // ---------- small helpers ----------
  function show(id) {
    ["loading", "editorPane", "mdPane", "htmlPane", "imgPane", "pdfPane", "messagePane"].forEach(function (pane) {
      $(pane).classList.toggle("hidden", pane !== id);
    });
  }
  function showMessage(title, text, path) {
    $("msgTitle").textContent = title;
    $("msgText").textContent = text;
    $("msgPath").textContent = path || "";
    show("messagePane");
  }
  function setError(text) { $("stErr").textContent = text || ""; }
  function formatBytes(n) {
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
    return (n / 1024 / 1024).toFixed(1) + " MB";
  }
  function textKind() { return file && file.kind !== "image" && file.kind !== "pdf" && file.kind !== "unsupported"; }
  function zoomKind() { return file && (file.kind === "image" || file.kind === "pdf"); }
  function current() { return editor ? editor.text() : saved; }
  function isDirty() { return Boolean(textKind() && editor && editor.isDirty()); }

  // ---------- header ----------
  function showHeader() {
    $("name").textContent = file.name;
    var path = $("path");
    path.replaceChildren();
    if (!file.copy) {
      var bdi = document.createElement("bdi");
      bdi.textContent = file.path;
      path.append(bdi);
      path.dataset.tooltip = file.path;
    }
    $("copyTag").classList.toggle("hidden", !file.copy);
    var editable = textKind();
    $("save").classList.toggle("hidden", !editable);
    $("saveAs").classList.toggle("hidden", !editable);
    $("prettify").classList.toggle("hidden", file.kind !== "json");
    $("modeSeg").classList.toggle("hidden", file.kind !== "markdown" && file.kind !== "html");
    $("zoomBar").classList.toggle("hidden", !zoomKind());
    $("stLang").textContent = file.kind === "code" ? langLabel() : LANG_LABEL[file.kind] || "";
    $("stEnc").textContent = editable ? (file.bom ? "UTF-8 BOM" : "UTF-8") : "";
    $("stEol").textContent = editable ? (file.eol === "\r\n" ? "CRLF" : "LF") : "";
    $("stSize").textContent = formatBytes(file.size);
    markDirty();
  }
  function langLabel() {
    var lang = window.hljs && file.lang && hljs.getLanguage(file.lang);
    return (lang && lang.name) || file.lang || "Code";
  }
  function markDirty() {
    var dirty = isDirty();
    $("dirty").classList.toggle("hidden", !dirty);
    $("save").classList.toggle("primary", dirty);
    $("save").disabled = !dirty;
  }

  // ---------- load ----------
  function load() {
    return scribe.file.read().then(function (res) {
      if (!res || !res.ok) {
        var err = (res && res.error) || "error";
        if (/not found/.test(err)) showMessage("File not found", "It was moved, renamed, or deleted.", res && res.path);
        else showMessage("Could not open the file", err, res && res.path);
        return;
      }
      file = res.file;
      showHeader();
      if (file.kind === "unsupported") {
        showMessage("Scribe can't show " + file.name, file.reason || "", file.copy ? "" : file.path);
        return;
      }
      if (file.kind === "image") {
        openImage();
        return;
      }
      if (file.kind === "pdf") {
        openPdf();
        return;
      }
      openText(file.text);
    });
  }

  var editorLoad = null;
  function loadEditor() {
    if (window.ScribeEditor) return Promise.resolve();
    editorLoad = editorLoad || new Promise(function (resolve, reject) {
      var script = document.createElement("script");
      script.src = "/vendor/editor.js";
      script.onload = function () { if (window.ScribeEditor) resolve(); else reject(new Error("The editor did not load.")); };
      script.onerror = function () { editorLoad = null; reject(new Error("The editor could not be loaded.")); };
      document.head.append(script);
    });
    return editorLoad;
  }

  /**
   * Show text that was read from disk. An open editor takes it as one undoable change, so carets,
   * folds and history survive a reload, and Ctrl+Z goes back to what was there before.
   */
  function openText(text) {
    saved = text;
    return loadEditor().then(function () {
      var opts = { kind: file.kind, lang: file.lang, name: file.name, indent: indentUnit() };
      if (!editor) {
        editor = ScribeEditor.create(Object.assign({ parent: editorPane, doc: text, wrap: wrapDefault(), onUpdate: onEditorUpdate, onWrap: onWrap }, opts));
        // A draft from before a reload, for this same version of the file: undo goes back to the file.
        var draft = scribe.local.draft;
        if (draft && draft.mtime === file.mtime && typeof draft.text === "string" && draft.text !== text) editor.setText(draft.text, "input.draft");
      } else {
        editor.setSaved(text);
        editor.configure(opts);
        editor.setText(text, "reload");
      }
      editor.setSaved(text);
      showWrap(editor.wrap());
      var stored = scribe.local.mode;
      mode = file.kind === "markdown" || file.kind === "html" ? (stored === "source" || stored === "render" ? stored : "render") : "source";
      applyMode();
      markDirty();
    }, function (err) {
      showMessage("Could not open the editor", String((err && err.message) || err), "");
    });
  }

  // ---------- modes ----------
  function applyMode() {
    var segButtons = $("modeSeg").querySelectorAll("button");
    segButtons.forEach(function (b) { b.classList.toggle("on", b.dataset.mode === mode); });
    if (mode === "render" && file.kind === "markdown") {
      renderMarkdown();
      show("mdPane");
    } else if (mode === "render" && file.kind === "html") {
      renderHtml();
      show("htmlPane");
    } else {
      show("editorPane");
      focusEditor();
    }
    $("wrapBtn").classList.toggle("hidden", !textKind() || mode !== "source");
    updatePos();
  }
  $("modeSeg").addEventListener("click", function (event) {
    var b = event.target.closest("button[data-mode]");
    if (!b || b.dataset.mode === mode) return;
    commitBlock();
    mode = b.dataset.mode;
    scribe.setLocal({ mode: mode });
    applyMode();
  });

  // ---------- editor ----------
  var draftTimer = null;
  var dirtyFrame = 0;
  function onEditorUpdate(update) {
    if (update.docChanged) {
      // Comparing a big file with the saved text on every key press adds up: once a frame.
      if (!dirtyFrame) dirtyFrame = requestAnimationFrame(function () { dirtyFrame = 0; markDirty(); });
      setError("");
      clearTimeout(draftTimer);
      draftTimer = setTimeout(saveDraft, 400);
      // The note after a reload goes once the text changes again (an edit, or the undo it offers).
      if (banner === "undo" && update.transactions.some(function (tr) { return tr.docChanged && !tr.isUserEvent("reload"); })) hideBanner();
    }
    if (update.docChanged || update.selectionSet) updatePos();
  }
  function saveDraft() {
    if (!file || !editor) return;
    if (editor.length() > DRAFT_MAX || !editor.isDirty()) {
      if (scribe.local.draft) scribe.setLocal({ draft: null });
      return;
    }
    scribe.setLocal({ draft: { mtime: file.mtime, text: current() } });
  }
  function updatePos() {
    if (!editor || !textKind() || mode !== "source") {
      if (textKind()) $("stPos").textContent = "";
      return;
    }
    var p = editor.position();
    $("stPos").textContent = "Ln " + p.line + ", Col " + p.col +
      (p.ranges > 1 ? " (" + p.ranges + " selections)" : p.selected ? " (" + p.selected + " selected)" : "");
  }

  // Word wrap: per viewer, on by default for prose.
  function wrapDefault() {
    var stored = scribe.local.wrap;
    return typeof stored === "boolean" ? stored : file.kind === "markdown" || file.kind === "text";
  }
  function showWrap(on) {
    var b = $("wrapBtn");
    b.classList.toggle("on", on);
    b.setAttribute("aria-pressed", String(on));
  }
  function onWrap(on) {
    scribe.setLocal({ wrap: on });
    showWrap(on);
  }
  $("wrapBtn").addEventListener("click", function () {
    if (editor) editor.toggleWrap();
  });

  function indentUnit() {
    var m = /^( +|\t)\S/m.exec(saved);
    if (m && m[1] === "\t") return "\t";
    return "  ".repeat(m && m[1].length >= 4 && m[1].length % 4 === 0 ? 2 : 1);
  }

  function focusEditor() {
    if (!editor || !textKind() || mode !== "source") return;
    editor.focus();
  }
  // The editor keeps focus: clicks on the bar or empty space go back to it.
  document.addEventListener("mousedown", function (event) {

      else if (kept && kept.fit) pdfView.fit = true;
      if (!res || !res.ok) {
        showMessage("Could not open the PDF", (res && res.error) || "", file.path);
        return;
      }
      return got[0].getDocument({
        data: new Uint8Array(res.buffer),
        cMapUrl: PDFJS + "cmaps/",
        cMapPacked: true,
        standardFontDataUrl: PDFJS + "standard_fonts/",
        wasmUrl: PDFJS + "wasm/",
        isEvalSupported: false,
      }).promise.then(function (doc) {
        if (load !== pdfLoad) { doc.destroy(); return; }
        var pages = [];
        for (var n = 1; n <= doc.numPages; n++) pages.push(doc.getPage(n));
        return Promise.all(pages).then(function (list) {
          if (load !== pdfLoad) { doc.destroy(); return; }
          if (pdfDoc) pdfDoc.destroy();
          pdfDoc = doc;
          buildPdfPages(list);
        });
      });
    }).catch(function (err) {
      if (load !== pdfLoad) return;
      var text = String((err && err.message) || err || "");
      if (err && err.name === "PasswordException") text = "The PDF is password protected.";
      showMessage("Scribe can't show " + file.name, text, file.copy ? "" : file.path);
    });
  }
  function buildPdfPages(list) {
    var top = pdfPane.scrollTop;
    if (pdfObserver) pdfObserver.disconnect();
    pdfPages.replaceChildren();
    pdfView.base = 1;
    list.forEach(function (page) {
      var box = page.getViewport({ scale: 1 });
      pdfView.base = Math.max(pdfView.base, box.width);
      var div = document.createElement("div");
      div.className = "pdf-page";
      div._page = page;
      pdfPages.append(div);
    });
    // Pages are drawn when they come near the view, and dropped again far from it.
    pdfObserver = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) drawPdfPage(entry.target);
        else clearPdfPage(entry.target);
      });
    }, { root: pdfPane, rootMargin: "100% 0px" });
    Array.prototype.forEach.call(pdfPages.children, function (div) { pdfObserver.observe(div); });
    pdfZoom(pdfView.fit ? null : pdfView.scale);
    pdfPane.scrollTop = top;
  }
  // Fit fills the pane's width up to a comfortable reading width; zooming in goes past it.
  var PDF_FIT_MAX = 1000;
  function fitWidthScale() {
    var w = Math.min(PDF_FIT_MAX, pdfPane.clientWidth - 32);
    return w > 0 ? Math.min(4, w / pdfView.base) : 1;
  }
  // The zoom the user picks is kept for the file, so it opens that way again (#685).
  var pdfSaveTimer = 0;
  function savePdfView() {
    if (!scribe.file.view) return;
    clearTimeout(pdfSaveTimer);
    pdfSaveTimer = setTimeout(function () {
      scribe.file.view(pdfView.fit ? { fit: true } : { scale: Math.round(pdfView.scale * 1000) / 1000 }).catch(function () {});
    }, 400);
  }
  function pdfZoomBy(scale) { pdfZoom(scale); savePdfView(); }
  /** scale null: fit the widest page to the pane's width. Keeps the page in view where it was. */
  function pdfZoom(scale) {
    if (!pdfDoc) return;
    var before = pdfView.scale;
    pdfView.fit = scale === null;
    pdfView.scale = Math.min(8, Math.max(0.1, pdfView.fit ? fitWidthScale() : scale));
    var ratio = pdfView.scale / before;
    var cx = pdfPane.scrollLeft + pdfPane.clientWidth / 2, cy = pdfPane.scrollTop + pdfPane.clientHeight / 2;
    Array.prototype.forEach.call(pdfPages.children, function (div) {
      var box = div._page.getViewport({ scale: pdfView.scale });
      div.style.width = Math.floor(box.width) + "px";
      div.style.height = Math.floor(box.height) + "px";
      div.style.setProperty("--total-scale-factor", String(pdfView.scale));
      if (div._scale !== pdfView.scale) clearPdfPage(div);
    });
    pdfPane.scrollLeft = cx * ratio - pdfPane.clientWidth / 2;
    pdfPane.scrollTop = cy * ratio - pdfPane.clientHeight / 2;
    $("zoomLabel").textContent = Math.round(pdfView.scale * 100) + "%";
    // The observer only reports changes: draw the pages already in view at the new size.
    if (pdfObserver) {
      pdfObserver.disconnect();
      Array.prototype.forEach.call(pdfPages.children, function (div) { pdfObserver.observe(div); });
    }
    pdfStatus();
  }
  function drawPdfPage(div) {
    if (div._scale === pdfView.scale) return;
    clearPdfPage(div);
    var scale = pdfView.scale;
    var viewport = div._page.getViewport({ scale: scale });
    var ratio = window.devicePixelRatio || 1;
    var canvas = document.createElement("canvas");
    canvas.width = Math.floor(viewport.width * ratio);
    canvas.height = Math.floor(viewport.height * ratio);
    var text = document.createElement("div");
    text.className = "textLayer";
    div.append(canvas, text);
    div._scale = scale;
    div._task = div._page.render({
      canvas: canvas,
      canvasContext: canvas.getContext("2d"),
      viewport: viewport,
      transform: ratio !== 1 ? [ratio, 0, 0, ratio, 0, 0] : null,
    });
    div._task.promise.catch(function () { /* cancelled by a zoom or scrolled away */ });
    div._text = new pdfjs.TextLayer({ textContentSource: div._page.streamTextContent(), container: text, viewport: viewport });
    div._text.render().catch(function () { /* cancelled */ });
  }
  function clearPdfPage(div) {
    if (div._task) div._task.cancel();
    if (div._text) div._text.cancel();
    div._task = div._text = null;
    div._scale = 0;
    div.replaceChildren();
  }
  function pdfStatus() {
    if (!pdfDoc) return;
    var mid = pdfPane.scrollTop + pdfPane.clientHeight / 2, n = 1;
    Array.prototype.forEach.call(pdfPages.children, function (div, i) {
      if (div.offsetTop <= mid) n = i + 1;
    });
    $("stPos").textContent = "Page " + n + " of " + pdfDoc.numPages;
  }
  pdfPane.addEventListener("scroll", pdfStatus, { passive: true });
  pdfPane.addEventListener("wheel", function (event) {
    if (!event.ctrlKey) return;
    event.preventDefault();
    pdfZoomBy(pdfView.scale * Math.exp(-event.deltaY * (event.deltaMode === 1 ? 0.05 : 0.0015)));
  }, { passive: false });
  new ResizeObserver(function () {
    if (file && file.kind === "pdf" && pdfView.fit && pdfDoc) pdfZoom(null);
  }).observe(pdfPane);

  load();
})();
</script>
</body>
</html>
