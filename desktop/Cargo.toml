[package]
name = "scribe-desktop"
version = "1.0.0"
description = "Desktop window for Scribe"
edition = "2021"
rust-version = "1.90"
default-run = "scribe"
autobins = false

[[bin]]
name = "scribe"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = { version = "0.16", default-features = false, features = ["gtk3"] }

[target.'cfg(windows)'.dependencies]
base64 = "0.22"
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_System_Variant", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell_PropertiesSystem"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
